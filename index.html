<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Job Search Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f4f0; --surface: #ffffff; --surface-2: #faf9f6; --ink: #1a1a18; --muted: #6a6963; --line: #e7e5de;
    --accent: #2f4f46; --accent-soft: #e3ece8; --info: #29506f; --info-soft: #e4edf5;
    --s-lead: #86847c; --s-verified: #2f5d8a; --s-ready: #7a5b9a; --s-applied: #2f6b3f; --s-interview: #a14b2a; --s-closed: #b3b1a9;
    --radius: 16px; --shadow: 0 1px 2px rgba(20,20,10,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #131312; --surface: #1c1c1a; --surface-2: #222220; --ink: #ecebe6; --muted: #9c9a91; --line: #2d2d2a;
      --accent: #8fb8a8; --accent-soft: #22302b; --info: #8fb6d9; --info-soft: #1f2c38;
      --s-lead: #9c9a91; --s-verified: #7fb0dc; --s-ready: #b79bd6; --s-applied: #7fc08f; --s-interview: #e39a78; --s-closed: #67655f;
    }
  }
  :root[data-theme="dark"] {
    --bg: #131312; --surface: #1c1c1a; --surface-2: #222220; --ink: #ecebe6; --muted: #9c9a91; --line: #2d2d2a;
    --accent: #8fb8a8; --accent-soft: #22302b; --info: #8fb6d9; --info-soft: #1f2c38;
    --s-lead: #9c9a91; --s-verified: #7fb0dc; --s-ready: #b79bd6; --s-applied: #7fc08f; --s-interview: #e39a78; --s-closed: #67655f;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 14.5px/1.55 "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  a { color: inherit; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 32px 20px 72px; }

  /* header */
  .top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
  h1 { font: 600 26px/1.15 "Poppins", sans-serif; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 13.5px; }
  .ghost { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: 13px; }
  .ghost:hover { border-color: var(--muted); }

  /* tabs */
  .tabs { display: flex; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; width: max-content; max-width: 100%; overflow-x: auto; margin-bottom: 20px; }
  .tab { border: 0; background: transparent; padding: 7px 16px; border-radius: 999px; cursor: pointer; color: var(--muted); font-weight: 500; font-size: 13.5px; white-space: nowrap; }
  .tab[aria-selected="true"] { background: var(--ink); color: var(--bg); }
  .tab .n { opacity: .6; margin-left: 6px; font-size: 12px; }

  /* bento */
  .bento { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 14px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); min-width: 0; }
  .c3 { grid-column: span 3; } .c4 { grid-column: span 4; } .c5 { grid-column: span 5; } .c6 { grid-column: span 6; } .c7 { grid-column: span 7; } .c8 { grid-column: span 8; } .c12 { grid-column: span 12; }
  @media (max-width: 960px) { .c3 { grid-column: span 6; } .c4, .c5, .c6, .c7, .c8 { grid-column: span 12; } }
  @media (max-width: 520px) { .c3 { grid-column: span 12; } }
  .eyebrow { font: 600 11px/1 "Poppins", sans-serif; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin: 0 0 12px; }
  .big { font: 600 34px/1 "Poppins", sans-serif; letter-spacing: -0.02em; }
  .hint { color: var(--muted); font-size: 13px; margin-top: 6px; }

  .callout { background: var(--info-soft); border-color: transparent; display: flex; gap: 14px; }
  .callout .bar { width: 3px; border-radius: 3px; background: var(--info); flex: none; }
  .callout h3 { font: 600 14px/1.3 "Poppins", sans-serif; margin: 0 0 6px; color: var(--info); }
  .callout p { margin: 0; }

  .pipe { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: var(--surface-2); margin: 6px 0 14px; }
  .pipe span { display: block; height: 100%; }
  .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; font-size: 13px; }
  .legend div { display: flex; align-items: center; justify-content: space-between; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; flex: none; }

  .list { display: flex; flex-direction: column; }
  .li { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); }
  .li:first-child { border-top: 0; padding-top: 0; }
  .li b { font-weight: 600; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .pill { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .pill.ok { color: var(--s-applied); border-color: color-mix(in srgb, var(--s-applied) 35%, transparent); }

  /* controls */
  .bar-controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
  .chip { border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 5px 13px; font-size: 13px; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: transparent; font-weight: 600; }
  .search { margin-left: auto; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 12px; min-width: 220px; }
  .search:focus, select:focus, .chip:focus-visible, .tab:focus-visible, .ghost:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  select { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 4px 8px; }

  /* job + company cards */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .card h3 { font: 600 15px/1.3 "Poppins", sans-serif; margin: 0; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .link { color: var(--accent); text-decoration: none; font-size: 13px; font-weight: 500; }
  .link:hover { text-decoration: underline; }
  .roles { border-top: 1px solid var(--line); padding-top: 8px; display: flex; flex-direction: column; gap: 8px; }
  .role { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13.5px; }
  .empty { padding: 36px 16px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--radius); }

  /* outreach */
  .tpl { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 13.5px; white-space: pre-wrap; }
  .tpl-head { display: flex; justify-content: space-between; align-items: center; margin: 14px 0 8px; font-weight: 600; font-family: "Poppins", sans-serif; font-size: 13.5px; }
  .tpl-head:first-of-type { margin-top: 0; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; font: 600 11px/1 "Poppins", sans-serif; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 0 8px 10px 0; }
  td { padding: 10px 8px 10px 0; border-top: 1px solid var(--line); vertical-align: top; }
  .scroll { overflow-x: auto; }
  footer { margin-top: 28px; color: var(--muted); font-size: 12.5px; }
</style>
</head>

<script>
/* ============ STATE + HELPERS ============ */
const STATUSES = [
  ["lead", "Lead"], ["verified", "Verified"], ["ready", "Ready"], ["applied", "Applied"], ["interview", "Interview"], ["closed", "Skipped"]
];
const LABEL = Object.fromEntries(STATUSES);
const KEY = "chandana-dashboard-v2";
const store = (() => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } })();
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} };
const statusOf = j => store[j.id] || j.status;
const state = { tab: "overview", status: "all", track: "all", q: "", cq: "" };

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const col = s => `var(--s-${s})`;
const fmtDate = d => d ? new Date(d + "T00:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short" }) : "";

const jobs = () => window.JOBS;
const applied = () => jobs().filter(j => statusOf(j) === "applied" || statusOf(j) === "interview");
const byCompany = () => {
  const m = new Map();
  jobs().forEach(j => { if (!m.has(j.company)) m.set(j.company, []); m.get(j.company).push(j); });
  return [...m.entries()].map(([name, list]) => ({
    name, list,
    applied: list.filter(j => ["applied", "interview"].includes(statusOf(j))).length
  })).sort((a, b) => b.applied - a.applied || b.list.length - a.list.length || a.name.localeCompare(b.name));
};

/* ============ COMPONENTS ============ */
const Dot = s => `<span class="dot" style="background:${col(s)}"></span>`;

const StatusSelect = j => `<label class="row" style="gap:6px">${Dot(statusOf(j))}<select data-job="${j.id}" aria-label="Status for ${esc(j.role)}">${STATUSES.map(([k, l]) => `<option value="${k}"${k === statusOf(j) ? " selected" : ""}>${l}</option>`).join("")}</select></label>`;

const Stat = (label, value, hint) => `<section class="tile c3"><p class="eyebrow">${label}</p><div class="big">${value}</div><div class="hint">${hint}</div></section>`;

const Callout = n => `<section class="tile callout c8"><div class="bar"></div><div><h3>${esc(n.title)}</h3><p>${esc(n.body)}</p></div></section>`;

const Pipeline = () => {
  const total = jobs().length || 1;
  const counts = STATUSES.map(([k, l]) => [k, l, jobs().filter(j => statusOf(j) === k).length]);
  return `<section class="tile c4"><p class="eyebrow">Pipeline</p>
    <div class="pipe" role="img" aria-label="Status split">${counts.map(([k, , n]) => n ? `<span style="width:${(n / total) * 100}%;background:${col(k)}"></span>` : "").join("")}</div>
    <div class="legend">${counts.map(([k, l, n]) => `<div><span>${Dot(k)}${l}</span><b>${n}</b></div>`).join("")}</div></section>`;
};

const Recent = () => {
  const rows = applied().sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  return `<section class="tile c6"><p class="eyebrow">Applied</p><div class="list">${rows.length ? rows.map(j => `
    <div class="li"><div><b>${esc(j.company)}</b><div class="small muted">${esc(j.role)}</div></div>
    <div style="text-align:right"><span class="pill ok">${fmtDate(j.date)}</span><div class="small muted" style="margin-top:4px">${esc(j.resume || "")} resume</div></div></div>`).join("") : `<div class="muted">Nothing yet.</div>`}</div></section>`;
};

const Next = () => `<section class="tile c6"><p class="eyebrow">Next actions</p><div class="list">${NEXT.map(t => `<div class="li"><span>${esc(t)}</span></div>`).join("")}</div></section>`;

const Resumes = () => `<section class="tile c4"><p class="eyebrow">Resume versions</p><div class="list">${RESUMES.map(r => `<div class="li"><div><b>${esc(r.name)}</b><div class="small muted">${esc(r.use)}</div></div></div>`).join("")}</div></section>`;

const Alerts = () => `<section class="tile c4"><p class="eyebrow">LinkedIn alerts</p><div class="list">${ALERTS.map(a => `<div class="li"><div><span>${esc(a.q)}</span>${a.note ? `<div class="small muted">${esc(a.note)}</div>` : ""}</div><span class="pill ${a.on ? "ok" : ""}">${a.on ? "On" : "Check"}</span></div>`).join("")}</div></section>`;

const Profile = () => `<section class="tile c4"><p class="eyebrow">Profile</p>
  <div class="list">${PROFILE.tracks.map(t => `<div class="li"><div><b>${esc(t.name)}</b><div class="small muted">${esc(t.detail)}</div></div></div>`).join("")}</div>
  <div style="margin-top:12px">${PROFILE.links.map(l => `<a class="link" style="margin-right:14px" href="${l.url}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join("")}</div></section>`;

const JobCard = j => `<article class="card">
  <div class="row"><h3>${esc(j.company)}</h3>${StatusSelect(j)}</div>
  <div>${esc(j.role)}</div>
  <div class="small muted">${esc(j.type)} · ${esc(j.track)} · ${esc(j.location)}</div>
  <div class="small muted">${esc(j.note)}</div>
  <div class="row"><span class="small muted">${j.date ? "Applied " + fmtDate(j.date) + (j.resume ? ", " + esc(j.resume) + " resume" : "") : ""}</span><a class="link" href="${j.url}" target="_blank" rel="noopener">Open posting</a></div>
</article>`;

const CompanyCard = c => `<article class="card">
  <div class="row"><h3>${esc(c.name)}</h3><span class="pill ${c.applied ? "ok" : ""}">${c.applied} applied of ${c.list.length}</span></div>
  <div class="roles">${c.list.map(j => `<div class="role"><span>${esc(j.role)}</span><span class="row" style="gap:6px">${Dot(statusOf(j))}<span class="small muted">${LABEL[statusOf(j)]}</span></span></div>`).join("")}</div>
</article>`;

/* ============ VIEWS ============ */
const Overview = () => {
  const a = applied();
  const companies = new Set(a.map(j => j.company)).size;
  const sent = OUTREACH.filter(o => o.status !== "drafted").length;
  return `<div class="bento">
    ${Stat("Applied", a.length, `${jobs().length} roles tracked`)}
    ${Stat("Companies", companies, "with at least one application")}
    ${Stat("Interviews", jobs().filter(j => statusOf(j) === "interview").length, "none yet")}
    ${Stat("Outreach sent", sent, "connection notes sent")}
    ${NOTES.map(Callout).join("")}
    ${Pipeline()}
    ${Recent()}
    ${Next()}
    ${Resumes()}
    ${Alerts()}
    ${Profile()}
  </div>`;
};

const Jobs = () => {
  const q = state.q.trim().toLowerCase();
  const tracks = ["all", ...new Set(jobs().map(j => j.track))];
  const list = jobs().filter(j => (state.status === "all" || statusOf(j) === state.status) && (state.track === "all" || j.track === state.track) && (!q || `${j.company} ${j.role} ${j.location}`.toLowerCase().includes(q)));
  const chip = (g, v, l) => `<button class="chip" type="button" data-g="${g}" data-v="${v}" aria-pressed="${state[g] === v}">${esc(l)}</button>`;
  return `<div class="bar-controls">
      ${chip("status", "all", "All")}${STATUSES.map(([k, l]) => chip("status", k, l)).join("")}
      <span style="width:6px"></span>${tracks.map(t => chip("track", t, t === "all" ? "Any track" : t)).join("")}
      <input class="search" id="q" type="search" placeholder="Search roles" value="${esc(state.q)}" aria-label="Search roles">
    </div>
    <div class="cards">${list.length ? list.map(JobCard).join("") : ""}</div>${list.length ? "" : `<div class="empty">Nothing matches these filters.</div>`}`;
};

const Companies = () => {
  const q = state.cq.trim().toLowerCase();
  const list = byCompany().filter(c => !q || c.name.toLowerCase().includes(q) || c.list.some(j => j.role.toLowerCase().includes(q)));
  return `<div class="bar-controls"><span class="muted small">${list.length} companies</span>
      <input class="search" id="cq" type="search" placeholder="Search companies or roles" value="${esc(state.cq)}" aria-label="Search companies"></div>
    <div class="cards">${list.map(CompanyCard).join("")}</div>${list.length ? "" : `<div class="empty">No company matches.</div>`}`;
};

const Outreach = () => {
  const targets = byCompany().filter(c => c.applied);
  const rows = OUTREACH.length ? `<div class="scroll"><table><thead><tr><th>Person</th><th>Company</th><th>Role applied</th><th>Channel</th><th>Status</th><th>Date</th></tr></thead><tbody>
    ${OUTREACH.map(o => `<tr><td><b>${esc(o.name)}</b><div class="small muted">${esc(o.title)}</div></td><td>${esc(o.company)}</td><td>${esc(o.role)}</td><td>${esc(o.channel)}</td><td><span class="pill ${o.status === "replied" || o.status === "referred" ? "ok" : ""}">${esc(o.status)}</span></td><td>${fmtDate(o.date)}</td></tr>`).join("")}
    </tbody></table></div>` : `<div class="empty">No messages sent yet. Targets and templates are ready.</div>`;
  return `<div class="bento">
    <section class="tile c7"><p class="eyebrow">Tracker</p>${rows}</section>
    <section class="tile c5"><p class="eyebrow">Who to reach at each company</p><div class="list">
      ${targets.map(c => `<div class="li"><div><b>${esc(c.name)}</b><div class="small muted">Talent acquisition, engineering managers, GITAM alumni</div></div><span class="pill">${c.applied} role${c.applied > 1 ? "s" : ""}</span></div>`).join("")}
    </div></section>
    <section class="tile c12"><p class="eyebrow">Message templates</p>
      ${TEMPLATES.map((t, i) => `<div class="tpl-head"><span>${esc(t.name)}</span><button class="ghost" type="button" data-copy="${i}">Copy</button></div><div class="tpl">${esc(t.body)}</div>`).join("")}
    </section></div>`;
};

const VIEWS = { overview: Overview, jobs: Jobs, companies: Companies, outreach: Outreach };

/* ============ SHELL ============ */
function renderTabs() {
  const counts = { jobs: jobs().length, companies: byCompany().length, outreach: OUTREACH.length };
  $("#tabs").innerHTML = [["overview", "Overview"], ["jobs", "Jobs"], ["companies", "Companies"], ["outreach", "Outreach"]]
    .map(([k, l]) => `<button class="tab" role="tab" type="button" data-tab="${k}" aria-selected="${state.tab === k}">${l}${counts[k] != null ? `<span class="n">${counts[k]}</span>` : ""}</button>`).join("");
}
function render() {
  renderTabs();
  $("#view").innerHTML = VIEWS[state.tab]();
  const active = document.activeElement;
}
function setTab(t) { state.tab = VIEWS[t] ? t : "overview"; history.replaceState(null, "", "#" + state.tab); render(); }

document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab]"); if (t) return setTab(t.dataset.tab);
  const c = e.target.closest(".chip"); if (c) { state[c.dataset.g] = c.dataset.v; return render(); }
  const cp = e.target.closest("[data-copy]");
  if (cp) { const body = TEMPLATES[+cp.dataset.copy].body; try { navigator.clipboard.writeText(body); cp.textContent = "Copied"; setTimeout(() => cp.textContent = "Copy", 1200); } catch (x) {} }
});
document.addEventListener("change", e => {
  const s = e.target.closest("select[data-job]"); if (s) { store[s.dataset.job] = s.value; persist(); render(); }
});
document.addEventListener("input", e => {
  if (e.target.id === "q") { state.q = e.target.value; const pos = e.target.selectionStart; render(); const n = $("#q"); n.focus(); n.setSelectionRange(pos, pos); }
  if (e.target.id === "cq") { state.cq = e.target.value; const pos = e.target.selectionStart; render(); const n = $("#cq"); n.focus(); n.setSelectionRange(pos, pos); }
});
$("#theme").onclick = () => {
  const el = document.documentElement;
  const dark = el.dataset.theme ? el.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  el.dataset.theme = dark ? "light" : "dark";
};

$("#name").textContent = PROFILE.name;
$("#tagline").textContent = `${PROFILE.title}, graduating ${PROFILE.grad}, CGPA ${PROFILE.cgpa}`;
$("#foot").textContent = `Last updated ${META.updated}. Status edits made here are saved in this browser only.`;
setTab((location.hash || "").replace("#", "") || "overview");
</script>
</body>
</html>
