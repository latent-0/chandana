    --accent: #2f4f46; --accent-soft: #e4ece8; --info: #29506f; --info-soft: #e7eef5;
    --s-lead: #8b897f; --s-verified: #2f5d8a; --s-ready: #7a5b9a; --s-applied: #2f6b3f; --s-interview: #a14b2a; --s-closed: #b8b6ae;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121211; --side: #171715; --surface: #1b1b19; --soft: #20201e; --hover: #262624; --ink: #ecebe6; --muted: #a09e95; --faint: #75736b; --line: #2c2c29;
      --accent: #8fb8a8; --accent-soft: #212e29; --info: #8fb6d9; --info-soft: #1e2a35;
      --s-lead: #a09e95; --s-verified: #7fb0dc; --s-ready: #b79bd6; --s-applied: #7fc08f; --s-interview: #e39a78; --s-closed: #67655f;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121211; --side: #171715; --surface: #1b1b19; --soft: #20201e; --hover: #262624; --ink: #ecebe6; --muted: #a09e95; --faint: #75736b; --line: #2c2c29;
    --accent: #8fb8a8; --accent-soft: #212e29; --info: #8fb6d9; --info-soft: #1e2a35;
    --s-lead: #a09e95; --s-verified: #7fb0dc; --s-ready: #b79bd6; --s-applied: #7fc08f; --s-interview: #e39a78; --s-closed: #67655f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 13.5px/1.5 "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  button, input, select { font-family: inherit; font-size: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 6px; }

  /* app shell */
  .app { display: grid; grid-template-columns: 224px minmax(0, 1fr); min-height: 100vh; }
  .side { background: var(--side); border-right: 1px solid var(--line); padding: 18px 12px; display: flex; flex-direction: column; gap: 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .brand { padding: 0 8px; }
  h1 { font: 600 15px/1.25 "Poppins", sans-serif; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 12px; }
  .search { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 7px 10px; }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav button { display: flex; justify-content: space-between; align-items: center; width: 100%; text-align: left; border: 0; background: none; border-radius: 8px; padding: 8px 10px; color: var(--muted); font-weight: 500; }
  .nav button:hover { background: var(--hover); color: var(--ink); }
  .nav button[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
  .nav .n { font-size: 12px; color: var(--faint); font-weight: 400; }
  .side .foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding: 0 4px; color: var(--faint); font-size: 12px; }
  .btn { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 6px 12px; font-size: 12.5px; }
  .btn:hover { background: var(--hover); }
  .main { padding: 22px 28px 56px; min-width: 0; max-width: 1280px; width: 100%; }
  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; }
    .side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; border-right: 0; border-bottom: 1px solid var(--line); padding: 12px; }
    .nav { flex-direction: row; overflow-x: auto; }
    .nav button { white-space: nowrap; gap: 8px; width: auto; }
    .side .foot { margin: 0 0 0 auto; flex-direction: row; align-items: center; }
    .search { width: 180px; }
    .main { padding: 16px 14px 48px; }
  }

  .ph { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .ph h2 { font: 600 20px/1.2 "Poppins", sans-serif; margin: 0; letter-spacing: -0.01em; }

  /* summary strip */
  .strip { display: flex; flex-wrap: wrap; gap: 6px 22px; padding: 10px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 14px; align-items: baseline; }
  .stat { background: none; border: 0; padding: 0; display: flex; align-items: baseline; gap: 7px; }
  .stat b { font: 600 17px/1 "Poppins", sans-serif; }
  .stat span { color: var(--muted); font-size: 12.5px; }
  .stat:hover span { color: var(--ink); }

  /* panels */
  .cols { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
  @media (max-width: 1100px) { .cols { grid-template-columns: 1fr; } }
  .stack { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
  .panel > h2, .panel > summary { font: 600 11px/1 "Poppins", sans-serif; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin: 0; padding: 13px 14px; list-style: none; display: flex; justify-content: space-between; align-items: center; }
  summary::-webkit-details-marker { display: none; }
  summary { cursor: pointer; }
  summary::after { content: "+"; font-size: 15px; color: var(--faint); letter-spacing: 0; }
  details[open] > summary::after { content: "\2212"; }
  .panel .body { padding: 0 14px 14px; }
  .panel .body.flush { padding: 0; }
  .note { display: flex; gap: 8px; align-items: center; background: var(--info-soft); border-radius: 10px; padding: 7px 12px; margin-bottom: 12px; font-size: 12.5px; }
  .note b { color: var(--info); font-family: "Poppins", sans-serif; font-weight: 600; white-space: nowrap; }
  .note button { margin-left: auto; border: 0; background: none; color: var(--muted); font-size: 16px; line-height: 1; }

  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 7px; flex: none; }
  select { border: 1px solid var(--line); background: var(--soft); border-radius: 7px; padding: 3px 6px; font-size: 12.5px; }
  .pill { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .pill.ok { color: var(--s-applied); border-color: color-mix(in srgb, var(--s-applied) 35%, transparent); }
  .tag { font-size: 11.5px; color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 0 7px; }

  .controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); border-radius: 12px 12px 0 0; z-index: 2; }
  .chip { border: 1px solid transparent; background: none; color: var(--muted); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; }
  .chip:hover { background: var(--hover); }
  .chip[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .chip .n { opacity: .6; margin-left: 4px; }
  .sep { width: 1px; height: 18px; background: var(--line); margin: 0 4px; }
  .push { margin-left: auto; display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 12.5px; }

  /* rows */
  .row { border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .rhead { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px; padding-right: 12px; }
  .rmain { display: grid; grid-template-columns: 190px minmax(0, 1.5fr) 110px minmax(0, 1fr) 54px 14px; gap: 12px; align-items: center; text-align: left; background: none; border: 0; padding: 9px 12px; width: 100%; }
  .rmain.compact { grid-template-columns: 180px minmax(0, 1fr) auto 54px 14px; }
  .rmain:hover { background: var(--hover); }
  .rmain .co { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rmain .role, .rmain .loc, .rmain .trk { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rmain .trk, .rmain .loc, .rmain .dt { color: var(--muted); font-size: 12.5px; }
  .chev { color: var(--faint); transition: transform .12s; font-size: 15px; }
  [aria-expanded="true"] .chev { transform: rotate(90deg); }
  .detail { padding: 4px 14px 14px; background: var(--soft); border-top: 1px dashed var(--line); display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px 18px; }
  .detail .wide { grid-column: 1 / -1; }
  .detail dt { font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 1px; }
  .detail dd { margin: 0; }
  .link { color: var(--accent); text-decoration: none; font-weight: 500; }
  .link:hover { text-decoration: underline; }
  @media (max-width: 860px) {
    .rmain, .rmain.compact { grid-template-columns: minmax(0, 1fr) auto 14px; }
    .rmain .trk, .rmain .loc, .rmain .dt { display: none; }
    .rmain .role { grid-column: 1; grid-row: 2; color: var(--muted); }
  }
  .empty { padding: 28px 14px; text-align: center; color: var(--muted); }

  .li { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); }
  .li:first-child { border-top: 0; }
  .muted { color: var(--muted); } .faint { color: var(--faint); } .small { font-size: 12.5px; }
  .pipe { display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: var(--soft); margin-bottom: 10px; }
  .pipe span { height: 100%; display: block; }
  .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 12px; }
  .legend button { display: flex; justify-content: space-between; align-items: center; border: 0; background: none; padding: 3px 4px; border-radius: 6px; text-align: left; }
  .legend button:hover { background: var(--hover); }
  .check { display: flex; gap: 8px; align-items: flex-start; padding: 5px 0; }
  .check input { margin-top: 3px; accent-color: var(--accent); }
  .check.done span { color: var(--faint); text-decoration: line-through; }

  /* companies */
  .md { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 900px) { .md { grid-template-columns: 1fr; } }
  .clist { max-height: calc(100vh - 150px); overflow: auto; }
  .citem { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 9px 12px; }
  .citem:first-child { border-top: 0; }
  .citem:hover { background: var(--hover); }
  .citem[aria-current="true"] { background: var(--accent-soft); }
  .cd h3 { font: 600 16px/1.2 "Poppins", sans-serif; margin: 0 0 2px; }
  .cd .sec { padding: 12px 14px; border-top: 1px solid var(--line); }
  .cd .sec:first-child { border-top: 0; }
  .h4 { margin: 0 0 8px; font: 600 11px/1 "Poppins", sans-serif; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }

  /* outreach */
  .orow { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1.2fr) 70px 110px; gap: 12px; align-items: center; padding: 9px 12px; border-top: 1px solid var(--line); }
  .orow.head { border-top: 0; font: 600 11px/1 "Poppins", sans-serif; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding-top: 12px; }
  @media (max-width: 860px) { .orow { grid-template-columns: 1fr 1fr; } .orow.head { display: none; } }
  .tpl { background: var(--soft); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; white-space: pre-wrap; margin-bottom: 8px; }
  .acc { border-top: 1px solid var(--line); }
  .acc:first-child { border-top: 0; }
  .acc > summary { text-transform: none; letter-spacing: 0; font: 500 13px/1.3 "Inter", sans-serif; color: var(--ink); }

  /* resumes */
  .rgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; margin-bottom: 14px; align-items: start; }
  .rh { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 14px; border-bottom: 1px solid var(--line); }
  .rh h3 { font: 600 16px/1.2 "Poppins", sans-serif; margin: 0 0 2px; }
  .def dt { font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: .06em; margin: 10px 0 2px; }
  .def dt:first-child { margin-top: 0; }
  .def dd { margin: 0; }
  .matrix { width: 100%; border-collapse: collapse; }
  .matrix th { text-align: left; font: 600 11px/1 "Poppins", sans-serif; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 0 12px 10px; }
  .matrix td { padding: 8px 12px; border-top: 1px solid var(--line); }
  .matrix td.c { text-align: center; }
  .matrix th.c { text-align: center; }
</style>

  { name: "SDE", title: "Smytten", company: "Smytten (PulseAI Research)", role: "SDE Intern, Backend", channel: "LinkedIn note with referral ask", status: "sent", date: "2026-10-11" },
  { name: "Member of Technical Staff, GITAM 2023", title: "Salesforce", company: "Salesforce", role: "Software intern referral", channel: "LinkedIn note with referral ask", status: "sent", date: "2026-10-11" },
  { name: "Software engineer, GITAM 2023", title: "J.P. Morgan", company: "J.P. Morgan", role: "Software intern referral", channel: "LinkedIn note with referral ask", status: "sent", date: "2026-10-11" },
  { name: "Software engineer, ex-Amazon intern", title: "Tejas Networks", company: "Tejas Networks", role: "Advice and referral", channel: "LinkedIn note with referral ask", status: "sent", date: "2026-10-11" },
  { name: "Software engineer R&D, Python and RAG", title: "Anritsu", company: "Anritsu", role: "Advice and referral", channel: "LinkedIn note with referral ask", status: "sent", date: "2026-10-11" },
  { name: "AI software engineer, ex-Oracle", title: "Acuver", company: "Acuver", role: "Advice and referral", channel: "LinkedIn note with referral ask", status: "sent", date: "2026-10-11" }
];

window.TEMPLATES = [
  { name: "Connection note (under 200 characters)", body: "Hi {first}, I am Chandana, a final-year CSE student at GITAM. I applied for the {role} role at {company} and would love to connect and learn more about the team." },
  { name: "Referral request", body: "Hi {first}, I hope you are doing well. I am Chandana Priya, a final-year B.Tech CSE student at GITAM (graduating Aug 2027). I recently applied for the {role} role at {company}.\n\nMy background includes a data engineering internship at DRDO RCI (NiFi, ClickHouse, Superset), an AI internship at VISWAM.AI with IIIT-H, and a RAG-based compliance copilot project.\n\nIf you feel my profile is a fit, I would be grateful for a referral or any advice on the process. I am happy to share my resume. Thank you for your time." },
  { name: "Recruiter note", body: "Hi {first}, I am Chandana, a final-year CSE student at GITAM. I have applied for the {role} role at {company} and wanted to introduce myself. I have hands-on experience in data engineering and LLM applications and would be glad to share more. Thank you." },
  { name: "Follow up after a week", body: "Hi {first}, a quick follow up on my earlier note about the {role} role at {company}. I remain very interested and can share anything that helps. Thank you for your time." }
];
</script>

<script>
/* ============ STATE + HELPERS ============ */
const STATUSES = [["lead", "Lead"], ["verified", "Verified"], ["ready", "Ready"], ["applied", "Applied"], ["interview", "Interview"], ["closed", "Skipped"]];
const LABEL = Object.fromEntries(STATUSES);
const OSTAT = ["sent", "accepted", "replied", "referred", "no reply"];
const KEY = "chandana-dashboard-v4";
const store = (() => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } })();
store.j = store.j || {}; store.o = store.o || {}; store.n = store.n || {};
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} };
const statusOf = j => store.j[j.id] || j.status;
const ostatus = (o, i) => store.o[i] || o.status;
const state = { tab: "overview", status: "all", track: "all", sort: "status", q: "", open: new Set(), company: null, noteHidden: false };
const PAGES = { overview: ["Overview", "Where things stand"], jobs: ["Jobs", "Every tracked role"], companies: ["Companies", "Roles and people by company"], outreach: ["Outreach", "Messages and templates"], resumes: ["Resumes", "Versions and where each was used"] };

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const col = s => `var(--s-${s})`;
const fmtDate = d => d ? new Date(d + "T00:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short" }) : "";
const ORDER = Object.fromEntries(["applied", "interview", "ready", "verified", "lead", "closed"].map((k, i) => [k, i]));
const jobs = () => window.JOBS;
const isApplied = j => ["applied", "interview"].includes(statusOf(j));
const matches = (j, q) => !q || `${j.company} ${j.role} ${j.location} ${j.track} ${j.resume || ""}`.toLowerCase().includes(q.toLowerCase());
const companies = () => {
  const m = new Map();
  jobs().forEach(j => { if (!m.has(j.company)) m.set(j.company, []); m.get(j.company).push(j); });
  return [...m.entries()].map(([name, list]) => ({ name, list, applied: list.filter(isApplied).length }))
    .sort((a, b) => b.applied - a.applied || b.list.length - a.list.length || a.name.localeCompare(b.name));
};
const keepScroll = fn => { const y = window.scrollY; fn(); window.scrollTo(0, y); };

/* ============ COMPONENTS ============ */
const Dot = s => `<span class="dot" style="background:${col(s)}"></span>`;
const StatusSelect = j => `<label style="display:flex;align-items:center">${Dot(statusOf(j))}<select data-job="${j.id}" aria-label="Status for ${esc(j.role)}">${STATUSES.map(([k, l]) => `<option value="${k}"${k === statusOf(j) ? " selected" : ""}>${l}</option>`).join("")}</select></label>`;

const Detail = j => {
  const related = OUTREACH.filter(o => o.company === j.company).length;
  return `<dl class="detail">
    <div class="wide"><dt>Notes</dt><dd>${esc(j.note || "None")}</dd></div>
    <div><dt>Type</dt><dd>${esc(j.type)}</dd></div>
    <div><dt>Track</dt><dd>${esc(j.track)}</dd></div>
    <div><dt>Location</dt><dd>${esc(j.location)}</dd></div>
    <div><dt>Applied</dt><dd>${j.date ? fmtDate(j.date) + (j.via ? " via " + esc(j.via) : "") : "Not yet"}</dd></div>
    <div><dt>Resume</dt><dd>${esc(j.resume || "Not chosen")}</dd></div>
    <div><dt>People messaged</dt><dd>${related}</dd></div>
    <div><dt>Posting</dt><dd><a class="link" href="${j.url}" target="_blank" rel="noopener">Open</a></dd></div>
  </dl>`;
};

const JobRow = (j, opts = {}) => {
  const open = state.open.has(j.id);
  const inner = opts.compact
    ? `<span class="co">${esc(j.company)}</span><span class="role">${esc(j.role)}</span><span>${j.resume ? `<span class="tag">${esc(j.resume)}</span>` : ""}</span><span class="dt">${fmtDate(j.date)}</span><span class="chev">&rsaquo;</span>`
    : `<span class="co">${esc(j.company)}</span><span class="role">${esc(j.role)}</span><span class="trk">${esc(j.track)}</span><span class="loc">${esc(j.location)}</span><span class="dt">${fmtDate(j.date)}</span><span class="chev">&rsaquo;</span>`;
  return `<div class="row"><div class="rhead">
      <button class="rmain ${opts.compact ? "compact" : ""}" type="button" data-toggle="${j.id}" aria-expanded="${open}">${inner}</button>
      ${opts.select === false ? "" : StatusSelect(j)}
    </div>${open ? Detail(j) : ""}</div>`;
};

/* ============ VIEWS ============ */
function Overview() {
  const total = jobs().length || 1;
  const counts = STATUSES.map(([k, l]) => [k, l, jobs().filter(j => statusOf(j) === k).length]);
  const a = jobs().filter(isApplied).sort((x, y) => (y.date || "").localeCompare(x.date || ""));
  const watch = jobs().filter(j => ["lead", "verified", "ready"].includes(statusOf(j)));
  const cos = new Set(a.map(j => j.company)).size;
  const acc = OUTREACH.filter((o, i) => ["accepted", "replied", "referred"].includes(ostatus(o, i))).length;
  const S = (n, l, act) => `<button class="stat" type="button" data-go="${act}"><b>${n}</b><span>${l}</span></button>`;
  return `
  ${state.noteHidden ? "" : NOTES.map(n => `<div class="note"><b>${esc(n.title)}</b><span>${esc(n.body)}</span><button type="button" data-hidenote aria-label="Dismiss">&times;</button></div>`).join("")}
  <section class="strip">${S(a.length, "applied", "applied")}${S(cos, "companies", "companies")}${S(OUTREACH.length, "messages", "outreach")}${S(acc, "accepted", "outreach")}${S(watch.length, "leads", "lead")}</section>
  <div class="cols">
    <div class="stack">
      <section class="panel"><h2>Applied</h2><div class="body flush">${a.length ? a.map(j => JobRow(j, { compact: true, select: false })).join("") : `<div class="empty">Nothing yet.</div>`}</div></section>
      <details class="panel"><summary>Leads to watch <span class="faint">${watch.length}</span></summary><div class="body flush">${watch.map(j => JobRow(j, { compact: true })).join("") || `<div class="empty">No open leads.</div>`}</div></details>
    </div>
    <div class="stack">
      <section class="panel"><h2>Pipeline</h2><div class="body">
        <div class="pipe">${counts.map(([k, , n]) => n ? `<span style="width:${(n / total) * 100}%;background:${col(k)}"></span>` : "").join("")}</div>
        <div class="legend">${counts.map(([k, l, n]) => `<button type="button" data-go="${k}"><span>${Dot(k)}${l}</span><b>${n}</b></button>`).join("")}</div>
      </div></section>
      <section class="panel"><h2>Next</h2><div class="body">${NEXT.map((t, i) => `<label class="check ${store.n[i] ? "done" : ""}"><input type="checkbox" data-next="${i}" ${store.n[i] ? "checked" : ""}><span>${esc(t)}</span></label>`).join("")}</div></section>
      <details class="panel"><summary>Alerts</summary><div class="body">${ALERTS.map(x => `<div class="li"><span>${esc(x.q)}</span><span class="pill ${x.on ? "ok" : ""}">${x.on ? "On" : "Check"}</span></div>`).join("")}</div></details>
    </div>
  </div>`;
}

function Jobs() {
  const tracks = ["all", ...new Set(jobs().map(j => j.track))];
  const cnt = k => k === "all" ? jobs().length : jobs().filter(j => statusOf(j) === k).length;
  const chip = (g, v, l, n) => `<button class="chip" type="button" data-g="${g}" data-v="${v}" aria-pressed="${state[g] === v}">${esc(l)}${n != null ? `<span class="n">${n}</span>` : ""}</button>`;
  return `<section class="panel">
    <div class="controls">
      ${chip("status", "all", "All", cnt("all"))}${STATUSES.map(([k, l]) => chip("status", k, l, cnt(k))).join("")}
      <span class="sep"></span>${tracks.map(t => chip("track", t, t === "all" ? "Any track" : t)).join("")}
      <span class="push">Sort <select id="sort" aria-label="Sort"><option value="status">Status</option><option value="recent">Recent</option><option value="company">Company</option></select>
      <button class="btn" type="button" data-expand>Expand all</button></span>
    </div><div id="jobsList"></div></section>`;
}
const filteredJobs = () => jobs().filter(j => (state.status === "all" || statusOf(j) === state.status) && (state.track === "all" || j.track === state.track) && matches(j, state.q));
function JobsList() {
  const by = { status: (a, b) => ORDER[statusOf(a)] - ORDER[statusOf(b)] || a.company.localeCompare(b.company), recent: (a, b) => (b.date || "").localeCompare(a.date || "") || a.company.localeCompare(b.company), company: (a, b) => a.company.localeCompare(b.company) };
  const list = filteredJobs().sort(by[state.sort]);
  $("#jobsList").innerHTML = list.length ? list.map(j => JobRow(j)).join("") : `<div class="empty">Nothing matches these filters.</div>`;
  const s = $("#sort"); if (s) s.value = state.sort;
}

function Companies() {
  const all = companies().filter(c => !state.q || c.name.toLowerCase().includes(state.q.toLowerCase()) || c.list.some(j => matches(j, state.q)));
  if (!all.find(c => c.name === state.company)) state.company = all[0] ? all[0].name : null;
  const sel = all.find(c => c.name === state.company);
  const msgs = sel ? OUTREACH.map((o, i) => [o, i]).filter(([o]) => o.company === sel.name || sel.name.startsWith(o.company) || o.company.startsWith(sel.name)) : [];
  return `<div class="md">
    <section class="panel"><h2>${all.length} companies</h2><div class="body flush clist">${all.map(c => `<button class="citem" type="button" data-company="${esc(c.name)}" aria-current="${c.name === state.company}"><span><b>${esc(c.name)}</b><div class="small muted">${c.list.length} role${c.list.length > 1 ? "s" : ""}</div></span><span class="pill ${c.applied ? "ok" : ""}">${c.applied} applied</span></button>`).join("") || `<div class="empty">No match.</div>`}</div></section>
    <section class="panel cd">${sel ? `<div class="sec"><h3>${esc(sel.name)}</h3><div class="muted small">${sel.applied} applied of ${sel.list.length} tracked, ${msgs.length} message${msgs.length === 1 ? "" : "s"} sent</div></div>
      <div class="sec" style="padding:0"><div style="padding:12px 14px 4px"><div class="h4" style="margin:0">Roles</div></div>${sel.list.map(j => JobRow(j)).join("")}</div>
      <div class="sec"><div class="h4">Outreach</div>${msgs.length ? msgs.map(([o, i]) => `<div class="li"><div><b>${esc(o.name)}</b><div class="small muted">${esc(o.role)}, ${fmtDate(o.date)}</div></div><span class="pill">${esc(ostatus(o, i))}</span></div>`).join("") : `<div class="muted small">No messages sent here yet.</div>`}</div>` : `<div class="empty">Select a company.</div>`}</section>
  </div>`;
}

function Outreach() {
  const rows = OUTREACH.map((o, i) => [o, i]).filter(([o]) => !state.q || `${o.company} ${o.name} ${o.role}`.toLowerCase().includes(state.q.toLowerCase()));
  const targets = companies().filter(c => c.applied);
  return `<div class="cols">
    <section class="panel"><h2>Messages <span class="faint">${rows.length}</span></h2><div class="body flush">
      <div class="orow head"><span>Person</span><span>Company</span><span>For</span><span>Date</span><span>Status</span></div>
      ${rows.length ? rows.map(([o, i]) => `<div class="orow"><span><b>${esc(o.name)}</b><div class="small muted">${esc(o.channel)}</div></span><span>${esc(o.company)}</span><span class="muted">${esc(o.role)}</span><span class="muted">${fmtDate(o.date)}</span><select data-ostat="${i}" aria-label="Status">${OSTAT.map(s => `<option${s === ostatus(o, i) ? " selected" : ""}>${s}</option>`).join("")}</select></div>`).join("") : `<div class="empty">No messages sent yet.</div>`}
    </div></section>
    <div class="stack">
      <details class="panel" open><summary>Templates</summary><div class="body flush">${TEMPLATES.map((t, i) => `<details class="acc"><summary>${esc(t.name)}</summary><div class="body"><div class="tpl">${esc(t.body)}</div><button class="btn" type="button" data-copy="${i}">Copy</button></div></details>`).join("")}</div></details>
      <details class="panel"><summary>Who to reach</summary><div class="body">${targets.map(c => `<div class="li"><div><b>${esc(c.name)}</b><div class="small muted">Engineers, hiring managers, GITAM alumni</div></div><span class="pill">${c.applied}</span></div>`).join("")}</div></details>
    </div>
  </div>`;
}

function Resumes() {
  const usedBy = r => jobs().filter(j => j.resume === r.name && isApplied(j)).sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  const names = RESUMES.map(r => r.name);
  const used = jobs().filter(j => j.resume && isApplied(j));
  const cos = [...new Set(used.map(j => j.company))];
  const cards = RESUMES.map(r => {
    const u = usedBy(r);
    return `<section class="panel">
      <div class="rh"><div><h3>${esc(r.name)}</h3><div class="muted small">${esc(r.use)}</div></div><span class="pill ${u.length ? "ok" : ""}">${u.length} used</span></div>
      <div class="body flush">${u.length ? u.map(j => JobRow(j, { compact: true, select: false })).join("") : `<div class="empty small">Not used yet</div>`}</div>
      <details class="acc"><summary>What is different</summary><div class="body"><dl class="def">
        <dt>Headline</dt><dd>${esc(r.headline)}</dd>
        <dt>Summary</dt><dd>${esc(r.summary)}</dd>
        <dt>Skills order</dt><dd>${esc(r.skills)}</dd>
        <dt>Project order</dt><dd>${esc(r.projects)}</dd>
        <dt>File</dt><dd class="muted">${esc(r.file)} (kept locally, not published)</dd>
      </dl></div></details></section>`;
  }).join("");
  const matrix = `<section class="panel"><h2>Company by resume</h2><div class="body flush" style="overflow-x:auto"><table class="matrix"><thead><tr><th>Company</th>${names.map(n => `<th class="c">${esc(n)}</th>`).join("")}<th>Roles</th></tr></thead><tbody>
    ${cos.map(c => { const rows = used.filter(j => j.company === c); return `<tr><td><b>${esc(c)}</b></td>${names.map(n => { const k = rows.filter(j => j.resume === n).length; return `<td class="c">${k ? `<span class="tag">${k}</span>` : `<span class="faint">0</span>`}</td>`; }).join("")}<td class="muted small">${rows.map(j => esc(j.role)).join(", ")}</td></tr>`; }).join("") || `<tr><td class="muted" colspan="${names.length + 2}">No applications yet.</td></tr>`}
    </tbody></table></div></section>`;
  return `<div class="rgrid">${cards}</div>${matrix}`;
}

const VIEWS = { overview: Overview, jobs: Jobs, companies: Companies, outreach: Outreach, resumes: Resumes };

/* ============ SHELL ============ */
function renderNav() {
  const n = { jobs: jobs().length, companies: companies().length, outreach: OUTREACH.length, resumes: RESUMES.length };
  $("#nav").innerHTML = Object.keys(PAGES).map(k => `<button type="button" data-tab="${k}" ${state.tab === k ? 'aria-current="page"' : ""}><span>${PAGES[k][0]}</span>${n[k] != null ? `<span class="n">${n[k]}</span>` : ""}</button>`).join("");
}
function render() {
  renderNav();
  $("#ptitle").textContent = PAGES[state.tab][0];
  $("#psub").textContent = PAGES[state.tab][1];
  $("#view").innerHTML = VIEWS[state.tab]();
  if (state.tab === "jobs") JobsList();
}
function setTab(t) { state.tab = VIEWS[t] ? t : "overview"; history.replaceState(null, "", "#" + state.tab); render(); window.scrollTo(0, 0); }
function go(a) {
  if (a === "companies" || a === "outreach") return setTab(a);
  if (LABEL[a]) { state.status = a; state.track = "all"; return setTab("jobs"); }
  if (a === "applied") { state.status = "applied"; return setTab("jobs"); }
}

document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]"); if (g) return go(g.dataset.go);
  const t = e.target.closest("[data-tab]"); if (t) return setTab(t.dataset.tab);
  if (e.target.closest("[data-hidenote]")) { state.noteHidden = true; return render(); }
  const c = e.target.closest(".chip"); if (c) { state[c.dataset.g] = c.dataset.v; return render(); }
  const tg = e.target.closest("[data-toggle]");
  if (tg) { const id = +tg.dataset.toggle; state.open.has(id) ? state.open.delete(id) : state.open.add(id); return keepScroll(render); }
  if (e.target.closest("[data-expand]")) { const list = filteredJobs(); const all = list.every(j => state.open.has(j.id)); list.forEach(j => all ? state.open.delete(j.id) : state.open.add(j.id)); return render(); }
  const co = e.target.closest("[data-company]"); if (co) { state.company = co.dataset.company; return render(); }
  const cp = e.target.closest("[data-copy]");
  if (cp) { try { navigator.clipboard.writeText(TEMPLATES[+cp.dataset.copy].body); cp.textContent = "Copied"; setTimeout(() => cp.textContent = "Copy", 1200); } catch (x) {} }
});
document.addEventListener("change", e => {
  const s = e.target.closest("select[data-job]"); if (s) { store.j[s.dataset.job] = s.value; persist(); return keepScroll(render); }
  const o = e.target.closest("select[data-ostat]"); if (o) { store.o[o.dataset.ostat] = o.value; persist(); return render(); }
  const n = e.target.closest("input[data-next]"); if (n) { store.n[n.dataset.next] = n.checked; persist(); return render(); }
  if (e.target.id === "sort") { state.sort = e.target.value; JobsList(); }
});
$("#gsearch").addEventListener("input", e => {
  state.q = e.target.value;
  if (state.q && (state.tab === "overview" || state.tab === "resumes")) return setTab("jobs"), $("#gsearch").focus();
  if (state.tab === "jobs") JobsList(); else render();
});
document.addEventListener("keydown", e => {
  const tag = document.activeElement.tagName;
  if (e.key === "/" && tag !== "INPUT" && tag !== "SELECT") { e.preventDefault(); $("#gsearch").focus(); }
  if (e.key === "Escape") { state.q = ""; $("#gsearch").value = ""; $("#gsearch").blur(); render(); }
});
$("#theme").onclick = () => {
  const el = document.documentElement;
  const dark = el.dataset.theme ? el.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  el.dataset.theme = dark ? "light" : "dark";
};

$("#name").textContent = PROFILE.name;
$("#tagline").textContent = `${PROFILE.title}, ${PROFILE.grad}`;
$("#upd").textContent = `Updated ${META.updated}`;
setTab((location.hash || "").replace("#", "") || "overview");
</script>
</body>
</html>
