<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Job Search Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f5f1; --side: #efede7; --surface: #ffffff; --soft: #faf9f6; --hover: #f1f0eb; --ink: #1a1a18; --muted: #6d6b65; --faint: #98968e; --line: #e8e6df;
    --accent: #2f4f46; --accent-soft: #e4ece8; --info: #29506f; --info-soft: #e7eef5; --warn: #b7791f; --warn-soft: #f7efdc;
    --s-lead: #8b897f; --s-verified: #2f5d8a; --s-ready: #7a5b9a; --s-applied: #2f6b3f; --s-interview: #a14b2a; --s-closed: #b8b6ae;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121211; --side: #171715; --surface: #1b1b19; --soft: #20201e; --hover: #262624; --ink: #ecebe6; --muted: #a09e95; --faint: #75736b; --line: #2c2c29;
      --accent: #8fb8a8; --accent-soft: #212e29; --info: #8fb6d9; --info-soft: #1e2a35; --warn: #e0b36a; --warn-soft: #2e281b;
      --s-lead: #a09e95; --s-verified: #7fb0dc; --s-ready: #b79bd6; --s-applied: #7fc08f; --s-interview: #e39a78; --s-closed: #67655f;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121211; --side: #171715; --surface: #1b1b19; --soft: #20201e; --hover: #262624; --ink: #ecebe6; --muted: #a09e95; --faint: #75736b; --line: #2c2c29;
    --accent: #8fb8a8; --accent-soft: #212e29; --info: #8fb6d9; --info-soft: #1e2a35; --warn: #e0b36a; --warn-soft: #2e281b;
    --s-lead: #a09e95; --s-verified: #7fb0dc; --s-ready: #b79bd6; --s-applied: #7fc08f; --s-interview: #e39a78; --s-closed: #67655f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 13.5px/1.5 "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  button, input, select { font-family: inherit; font-size: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 6px; }

  /* app shell */
  .app { display: grid; grid-template-columns: 224px minmax(0, 1fr); min-height: 100vh; }
  .side { background: var(--side); border-right: 1px solid var(--line); padding: 18px 12px; display: flex; flex-direction: column; gap: 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .brand { padding: 0 8px; }
  h1 { font: 600 15px/1.25 "Poppins", sans-serif; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 12px; }
  .search { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 7px 10px; }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav button { display: flex; justify-content: space-between; align-items: center; width: 100%; text-align: left; border: 0; background: none; border-radius: 8px; padding: 8px 10px; color: var(--muted); font-weight: 500; }
  .nav button:hover { background: var(--hover); color: var(--ink); }
  .nav button[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
  .nav .n { font-size: 12px; color: var(--faint); font-weight: 400; }
  .side .foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding: 0 4px; color: var(--faint); font-size: 12px; }
  .btn { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 6px 12px; font-size: 12.5px; }
  .btn:hover { background: var(--hover); }
  .main { padding: 22px 28px 56px; min-width: 0; max-width: 1280px; width: 100%; }
  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; }
    .side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; border-right: 0; border-bottom: 1px solid var(--line); padding: 12px; }
    .nav { flex-direction: row; overflow-x: auto; }
    .nav button { white-space: nowrap; gap: 8px; width: auto; }
    .side .foot { margin: 0 0 0 auto; flex-direction: row; align-items: center; }
    .search { width: 180px; }
    .main { padding: 16px 14px 48px; }
  }

  .ph { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .ph h2 { font: 600 20px/1.2 "Poppins", sans-serif; margin: 0; letter-spacing: -0.01em; }

  /* summary strip */
  .strip { display: flex; flex-wrap: wrap; gap: 6px 22px; padding: 10px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 14px; align-items: baseline; }
  .stat { background: none; border: 0; padding: 0; display: flex; align-items: baseline; gap: 7px; }
  .stat b { font: 600 17px/1 "Poppins", sans-serif; }
  .stat span { color: var(--muted); font-size: 12.5px; }
  .stat:hover span { color: var(--ink); }

  /* panels */
  .cols { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
  @media (max-width: 1100px) { .cols { grid-template-columns: 1fr; } }
  .stack { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
  .panel > h2, .panel > summary { font: 600 11px/1 "Poppins", sans-serif; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin: 0; padding: 13px 14px; list-style: none; display: flex; justify-content: space-between; align-items: center; }
  summary::-webkit-details-marker { display: none; }
  summary { cursor: pointer; }
  summary::after { content: "+"; font-size: 15px; color: var(--faint); letter-spacing: 0; }
  details[open] > summary::after { content: "\2212"; }
  .panel .body { padding: 0 14px 14px; }
  .panel .body.flush { padding: 0; }
  .note { display: flex; gap: 8px; align-items: center; background: var(--info-soft); border-radius: 10px; padding: 7px 12px; margin-bottom: 12px; font-size: 12.5px; }
  .note b { color: var(--info); font-family: "Poppins", sans-serif; font-weight: 600; white-space: nowrap; }
  .note button { margin-left: auto; border: 0; background: none; color: var(--muted); font-size: 16px; line-height: 1; }

  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 7px; flex: none; }
  select { border: 1px solid var(--line); background: var(--soft); border-radius: 7px; padding: 3px 6px; font-size: 12.5px; }
  .pill { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .pill.ok { color: var(--s-applied); border-color: color-mix(in srgb, var(--s-applied) 35%, transparent); }
  .tag { font-size: 11.5px; color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 0 7px; }

  .controls { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); border-radius: 12px 12px 0 0; z-index: 2; }
  .seg { display: inline-flex; flex-wrap: wrap; gap: 2px; background: var(--soft); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  .seg button { display: inline-flex; align-items: center; border: 0; background: none; color: var(--muted); border-radius: 7px; padding: 5px 10px; font-size: 12.5px; font-weight: 500; }
  .seg button:hover { background: var(--hover); color: var(--ink); }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgba(0,0,0,.06); }
  .seg button.zero { opacity: .5; }
  .seg .n { margin-left: 6px; color: var(--faint); font-weight: 400; font-size: 12px; }
  .ctl { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
  .ctl label { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12.5px; }
  .ctl select { padding: 5px 8px; }
  .subbar { display: flex; align-items: center; gap: 12px; padding: 8px 14px; color: var(--muted); font-size: 12.5px; border-bottom: 1px solid var(--line); background: var(--soft); }
  .linkbtn { border: 0; background: none; color: var(--accent); font-weight: 500; padding: 0; }
  .linkbtn:hover { text-decoration: underline; }
  .linkbtn[hidden] { display: none; }

  /* rows */
  .row { border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .rhead { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px; padding-right: 12px; }
  .rmain { display: grid; grid-template-columns: 190px minmax(0, 1.5fr) 110px minmax(0, 1fr) 54px 14px; gap: 12px; align-items: center; text-align: left; background: none; border: 0; padding: 9px 12px; width: 100%; }
  .rmain.compact { grid-template-columns: 180px minmax(0, 1fr) auto 54px 14px; }
  .rmain:hover { background: var(--hover); }
  .rmain .co { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rmain .role, .rmain .loc, .rmain .trk { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rmain .trk, .rmain .loc, .rmain .dt { color: var(--muted); font-size: 12.5px; }
  .chev { color: var(--faint); transition: transform .12s; font-size: 15px; }
  [aria-expanded="true"] .chev { transform: rotate(90deg); }
  .detail { padding: 4px 14px 14px; background: var(--soft); border-top: 1px dashed var(--line); display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px 18px; }
  .detail .wide { grid-column: 1 / -1; }
  .detail dt { font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 1px; }
  .detail dd { margin: 0; }
  .link { color: var(--accent); text-decoration: none; font-weight: 500; }
  .link:hover { text-decoration: underline; }
  @media (max-width: 860px) {
    .rmain, .rmain.compact { grid-template-columns: minmax(0, 1fr) auto 14px; }
    .rmain .trk, .rmain .loc, .rmain .dt { display: none; }
    .rmain .role { grid-column: 1; grid-row: 2; color: var(--muted); }
  }
  .empty { padding: 28px 14px; text-align: center; color: var(--muted); }

  .li { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); }
  .li:first-child { border-top: 0; }
  .muted { color: var(--muted); } .faint { color: var(--faint); } .small { font-size: 12.5px; }
  .pipe { display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: var(--soft); margin-bottom: 10px; }
  .pipe span { height: 100%; display: block; }
  .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 12px; }
  .legend button { display: flex; justify-content: space-between; align-items: center; border: 0; background: none; padding: 3px 4px; border-radius: 6px; text-align: left; }
  .legend button:hover { background: var(--hover); }
  .check { display: flex; gap: 8px; align-items: flex-start; padding: 5px 0; }
  .check input { margin-top: 3px; accent-color: var(--accent); }
  .check.done span { color: var(--faint); text-decoration: line-through; }

  /* companies */
  .md { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 900px) { .md { grid-template-columns: 1fr; } }
  .clist { max-height: calc(100vh - 150px); overflow: auto; }
  .citem { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 9px 12px; }
  .citem:first-child { border-top: 0; }
  .citem:hover { background: var(--hover); }
  .citem[aria-current="true"] { background: var(--accent-soft); }
  .cd h3 { font: 600 16px/1.2 "Poppins", sans-serif; margin: 0 0 2px; }
  .cd .sec { padding: 12px 14px; border-top: 1px solid var(--line); }
  .cd .sec:first-child { border-top: 0; }
  .h4 { margin: 0 0 8px; font: 600 11px/1 "Poppins", sans-serif; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }

  /* outreach */
  .orow { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1.2fr) 70px 110px; gap: 12px; align-items: center; padding: 9px 12px; border-top: 1px solid var(--line); }
  .orow.head { border-top: 0; font: 600 11px/1 "Poppins", sans-serif; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding-top: 12px; }
  @media (max-width: 860px) { .orow { grid-template-columns: 1fr 1fr; } .orow.head { display: none; } }
  .tpl { background: var(--soft); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; white-space: pre-wrap; margin-bottom: 8px; }
  .acc { border-top: 1px solid var(--line); }
  .acc:first-child { border-top: 0; }
  .acc > summary { text-transform: none; letter-spacing: 0; font: 500 13px/1.3 "Inter", sans-serif; color: var(--ink); }

  /* resumes */
  .rgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; margin-bottom: 14px; align-items: start; }
  .rh { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 14px; border-bottom: 1px solid var(--line); }
  .rh h3 { font: 600 16px/1.2 "Poppins", sans-serif; margin: 0 0 2px; }
  .def dt { font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: .06em; margin: 10px 0 2px; }
  .def dt:first-child { margin-top: 0; }
  .def dd { margin: 0; }
  .matrix { width: 100%; border-collapse: collapse; }
  .matrix th { text-align: left; font: 600 11px/1 "Poppins", sans-serif; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 0 12px 10px; }
  .matrix td { padding: 8px 12px; border-top: 1px solid var(--line); }
  .matrix td.c { text-align: center; }
  .matrix th.c { text-align: center; }
  /* widgets */
  .wgrid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 14px; align-items: start; }
  .w { grid-column: span var(--span, 12); min-width: 0; }
  @media (max-width: 1100px) { .w { grid-column: span 12; } }
  .wh { display: flex; justify-content: space-between; align-items: center; padding-right: 8px; }
  .wh h2 { font: 600 11px/1 "Poppins", sans-serif; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin: 0; padding: 13px 14px; }
  .wc { border: 0; background: none; color: var(--faint); width: 26px; height: 26px; border-radius: 7px; font-size: 16px; line-height: 1; }
  .wc:hover { background: var(--hover); color: var(--ink); }
  .wb { padding: 0 0 4px; }
  .wpad { padding: 2px 14px 14px; }
  .radar { display: block; width: 100%; max-width: 340px; margin: 0 auto; }
  .rl { font: 500 11.5px "Inter", sans-serif; fill: var(--ink); }
  .rv { font: 400 11px "Inter", sans-serif; fill: var(--muted); }
  .bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; }
  .bar { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .bpair { display: flex; align-items: flex-end; gap: 3px; height: 92px; width: 100%; justify-content: center; border-bottom: 1px solid var(--line); }
  .bpair i { display: block; width: 14px; min-height: 2px; border-radius: 4px 4px 0 0; }
  .hb { margin-bottom: 11px; }
  .hb:last-of-type { margin-bottom: 8px; }
  .row2 { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
  .track { position: relative; height: 8px; background: var(--soft); border-radius: 999px; overflow: hidden; }
  .track i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; }
  .cust { position: relative; }
  .menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.12); padding: 10px 14px; min-width: 200px; }  .acc > summary, summary { list-style: none; }
  .rmain.stack { grid-template-columns: minmax(0, 1fr) auto auto 14px; }
  .rmain .two { display: flex; flex-direction: column; min-width: 0; }
  .rmain .two .co, .rmain .two .role { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rgrid { align-items: stretch; }
  .rcard { display: flex; flex-direction: column; }
  .rcard .rbody { flex: 1; }
  .rfoot { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border-top: 1px solid var(--line); }
  .btn.dl { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 500; text-decoration: none; }
  .btn.dl:hover { opacity: .88; background: var(--ink); }
  .scrollx { overflow-x: auto; }
  .cmp { width: 100%; border-collapse: collapse; min-width: 640px; }
  .cmp th, .cmp td { text-align: left; vertical-align: top; padding: 11px 14px; border-top: 1px solid var(--line); }
  .cmp thead th { border-top: 0; font: 600 12px/1 "Poppins", sans-serif; color: var(--ink); padding-top: 4px; }
  .cmp tbody th { width: 120px; font: 600 11px/1.4 "Poppins", sans-serif; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
  .cmp td { line-height: 1.5; }  /* interview prep */
  .prepbar { display: flex; align-items: center; gap: 10px; }
  .prepbar select { max-width: 340px; padding: 6px 8px; }
  .steps { list-style: none; margin: 0 0 8px; padding: 0; position: relative; }
  .steps li { display: flex; gap: 12px; padding: 0 0 14px; position: relative; }
  .steps li:not(:last-child)::before { content: ""; position: absolute; left: 13px; top: 28px; bottom: 0; width: 2px; background: var(--line); }
  .sn { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--bg); display: grid; place-items: center; font: 600 13px "Poppins", sans-serif; }
  .steps b { font: 600 11px "Poppins", sans-serif; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .fitgrid { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 18px; align-items: start; }
  @media (max-width: 800px) { .fitgrid { grid-template-columns: 1fr; } }
  .ringrow { display: flex; align-items: center; gap: 12px; margin-top: 4px; }
  .ring { width: 78px; height: 78px; flex: none; }
  .ringn { font: 600 17px "Poppins", sans-serif; fill: var(--ink); }
  .reqs { display: flex; flex-direction: column; }
  .req { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--line); }
  .req:first-child { border-top: 0; }
  .lv { flex: none; font-size: 11px; font-weight: 600; border-radius: 6px; padding: 1px 8px; margin-top: 2px; min-width: 56px; text-align: center; }
  .lv.strong { background: var(--accent-soft); color: var(--s-applied); }
  .lv.partial { background: var(--warn-soft); color: var(--warn); }
  .lv.gap { background: color-mix(in srgb, var(--s-interview) 16%, transparent); color: var(--s-interview); }
  .nums { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 10px; }
  .num { background: var(--soft); border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; }
  .num b { font: 600 22px/1.1 "Poppins", sans-serif; }
  .num span { font-size: 12.5px; }
  .num i { font-style: normal; font-size: 11px; color: var(--faint); margin-top: 2px; }
  .cards2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; }
  .story { border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: var(--soft); display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .sh { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .story h3 { margin: 0; font: 600 14px/1.3 "Poppins", sans-serif; }
  .mini { display: flex; gap: 8px; }
  .mini span { display: flex; flex-direction: column; align-items: center; font-size: 10.5px; color: var(--muted); text-align: center; }
  .mini b { font: 600 16px "Poppins", sans-serif; color: var(--ink); }
  .flow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 4px; }
  .fs { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 3px 9px; font-size: 12px; }
  .arr { color: var(--faint); font-size: 13px; }
  .gate { width: 100%; max-width: 340px; }
  .gl { font: 500 10px "Inter", sans-serif; fill: var(--ink); }
  .say { font-size: 13px; }
  .angle { font-size: 12.5px; color: var(--accent); background: var(--accent-soft); border-radius: 8px; padding: 6px 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip2 { font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 10px; background: var(--surface); color: var(--muted); }
  .chip2.fill { border-style: dashed; color: var(--warn); border-color: var(--warn); background: transparent; }
  .chip2.big { font-size: 13px; padding: 4px 12px; color: var(--ink); background: var(--accent-soft); border-color: transparent; }
  .more > summary { list-style: none; cursor: pointer; font-size: 12.5px; color: var(--accent); font-weight: 500; }
  .more > summary::after { content: ""; }
  .bul { margin: 6px 0 0; padding-left: 18px; }

<script>
/* ============ STATE + HELPERS ============ */
const STATUSES = [["lead", "Lead"], ["verified", "Verified"], ["ready", "Ready"], ["applied", "Applied"], ["interview", "Interview"], ["closed", "Skipped"]];
const LABEL = Object.fromEntries(STATUSES);
const OSTAT = ["sent", "accepted", "replied", "referred", "no reply"];
const KEY = "chandana-dashboard-v4";
const store = (() => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } })();
store.j = store.j || {}; store.o = store.o || {}; store.n = store.n || {};
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} };
const statusOf = j => store.j[j.id] || j.status;
const ostatus = (o, i) => store.o[i] || o.status;
const state = { tab: "overview", status: "all", track: "all", sort: "status", q: "", open: new Set(), company: null, noteHidden: false, prep: null };
const PAGES = { overview: ["Overview", "Where things stand"], jobs: ["Jobs", "Every tracked role"], companies: ["Companies", "Roles and people by company"], outreach: ["Outreach", "Messages and templates"], resumes: ["Resumes", "Versions and where each was used"], prep: ["Interview prep", "Pick a role you applied to"] };

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const col = s => `var(--s-${s})`;
const fmtDate = d => d ? new Date(d + "T00:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short" }) : "";
const ORDER = Object.fromEntries(["applied", "interview", "ready", "verified", "lead", "closed"].map((k, i) => [k, i]));
const jobs = () => window.JOBS;
const isApplied = j => ["applied", "interview"].includes(statusOf(j));
const matches = (j, q) => !q || `${j.company} ${j.role} ${j.location} ${j.track} ${j.resume || ""}`.toLowerCase().includes(q.toLowerCase());
const companies = () => {
  const m = new Map();
  jobs().forEach(j => { if (!m.has(j.company)) m.set(j.company, []); m.get(j.company).push(j); });
  return [...m.entries()].map(([name, list]) => ({ name, list, applied: list.filter(isApplied).length }))
    .sort((a, b) => b.applied - a.applied || b.list.length - a.list.length || a.name.localeCompare(b.name));
};
const keepScroll = fn => { const y = window.scrollY; fn(); window.scrollTo(0, y); };

/* ============ COMPONENTS ============ */
const Dot = s => `<span class="dot" style="background:${col(s)}"></span>`;
const StatusSelect = j => `<label style="display:flex;align-items:center">${Dot(statusOf(j))}<select data-job="${j.id}" aria-label="Status for ${esc(j.role)}">${STATUSES.map(([k, l]) => `<option value="${k}"${k === statusOf(j) ? " selected" : ""}>${l}</option>`).join("")}</select></label>`;

const Detail = j => {
  const related = OUTREACH.filter(o => o.company === j.company).length;
  return `<dl class="detail">
    <div class="wide"><dt>Notes</dt><dd>${esc(j.note || "None")}</dd></div>
    <div><dt>Type</dt><dd>${esc(j.type)}</dd></div>
    <div><dt>Track</dt><dd>${esc(j.track)}</dd></div>
    <div><dt>Location</dt><dd>${esc(j.location)}</dd></div>
    <div><dt>Applied</dt><dd>${j.date ? fmtDate(j.date) + (j.via ? " via " + esc(j.via) : "") : "Not yet"}</dd></div>
    <div><dt>Resume</dt><dd>${esc(j.resume || "Not chosen")}</dd></div>
    <div><dt>People messaged</dt><dd>${related}</dd></div>
    <div><dt>Posting</dt><dd><a class="link" href="${j.url}" target="_blank" rel="noopener">Open</a></dd></div>
  </dl>`;
};

const JobRow = (j, opts = {}) => {
  const open = state.open.has(j.id);
  const inner = opts.stack
    ? `<span class="two"><span class="co">${esc(j.company)}</span><span class="role muted">${esc(j.role)}</span></span><span>${j.resume ? `<span class="tag">${esc(j.resume)}</span>` : ""}</span><span class="dt">${fmtDate(j.date)}</span><span class="chev">&rsaquo;</span>`
    : opts.compact
    ? `<span class="co">${esc(j.company)}</span><span class="role">${esc(j.role)}</span><span>${j.resume ? `<span class="tag">${esc(j.resume)}</span>` : ""}</span><span class="dt">${fmtDate(j.date)}</span><span class="chev">&rsaquo;</span>`
    : `<span class="co">${esc(j.company)}</span><span class="role">${esc(j.role)}</span><span class="trk">${esc(j.track)}</span><span class="loc">${esc(j.location)}</span><span class="dt">${fmtDate(j.date)}</span><span class="chev">&rsaquo;</span>`;
  return `<div class="row"><div class="rhead">
      <button class="rmain ${opts.compact ? "compact" : ""} ${opts.stack ? "stack" : ""}" type="button" data-toggle="${j.id}" aria-expanded="${open}">${inner}</button>
      ${opts.select === false ? "" : StatusSelect(j)}
    </div>${open ? Detail(j) : ""}</div>`;
};

/* ============ VIEWS ============ */
/* ============ OVERVIEW WIDGETS ============ */
store.w = store.w || { hidden: {}, collapsed: {} };
store.w.hidden = store.w.hidden || {}; store.w.collapsed = store.w.collapsed || {};
const isoDay = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const appliedJobs = () => jobs().filter(isApplied);
const acceptedCount = () => OUTREACH.filter((o, i) => ["accepted", "replied", "referred"].includes(ostatus(o, i))).length;
const watchJobs = () => jobs().filter(j => ["lead", "verified", "ready"].includes(statusOf(j)));
const usedResumes = () => new Set(appliedJobs().map(j => j.resume).filter(Boolean)).size;

function Radar(items) {
  const S = 320, c = S / 2, R = 96, n = items.length;
  const ang = i => -Math.PI / 2 + (i * 2 * Math.PI) / n;
  const pt = (i, r) => [c + r * Math.cos(ang(i)), c + r * Math.sin(ang(i))];
  const poly = f => items.map((_, i) => pt(i, R * f).map(v => v.toFixed(1)).join(",")).join(" ");
  const rings = [0.25, 0.5, 0.75, 1].map(f => `<polygon points="${poly(f)}" fill="none" stroke="var(--line)" stroke-width="1"/>`).join("");
  const spokes = items.map((_, i) => { const [x, y] = pt(i, R); return `<line x1="${c}" y1="${c}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)"/>`; }).join("");
  const shape = items.map((it, i) => pt(i, R * Math.max(it.value, 0.03)).map(v => v.toFixed(1)).join(",")).join(" ");
  const dots = items.map((it, i) => { const [x, y] = pt(i, R * Math.max(it.value, 0.03)); return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.2" fill="var(--accent)"/>`; }).join("");
  const labels = items.map((it, i) => {
    const [x, y] = pt(i, R + 20); const cs = Math.cos(ang(i));
    const anchor = Math.abs(cs) < 0.2 ? "middle" : cs > 0 ? "start" : "end";
    return `<text x="${x.toFixed(1)}" y="${(y - 2).toFixed(1)}" text-anchor="${anchor}" class="rl">${esc(it.label)}</text><text x="${x.toFixed(1)}" y="${(y + 11).toFixed(1)}" text-anchor="${anchor}" class="rv">${esc(it.text)}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${S} ${S}" class="radar" role="img" aria-label="Progress against weekly goals: ${esc(items.map(i => i.label + " " + i.text).join(", "))}">${rings}${spokes}<polygon points="${shape}" fill="var(--accent)" fill-opacity=".18" stroke="var(--accent)" stroke-width="1.6" stroke-linejoin="round"/>${dots}${labels}</svg>`;
}

const wKpis = () => {
  const a = appliedJobs();
  const S = (n, l, act) => `<button class="stat" type="button" data-go="${act}"><b>${n}</b><span>${l}</span></button>`;
  return `<div class="strip">${S(a.length, "applied", "applied")}${S(new Set(a.map(j => j.company)).size, "companies", "companies")}${S(OUTREACH.length, "messages", "outreach")}${S(acceptedCount(), "accepted", "outreach")}${S(watchJobs().length, "leads", "lead")}${S(jobs().filter(j => statusOf(j) === "interview").length, "interviews", "interview")}</div>`;
};
const wApplied = () => { const a = appliedJobs().sort((x, y) => (y.date || "").localeCompare(x.date || "")); return a.length ? a.map(j => JobRow(j, { compact: true, select: false })).join("") : `<div class="empty">Nothing yet.</div>`; };
const wGoals = () => {
  const val = { applied: appliedJobs().length, outreach: OUTREACH.length, accepted: acceptedCount(), companies: new Set(appliedJobs().map(j => j.company)).size, alerts: ALERTS.filter(a => a.on).length, resumes: usedResumes() };
  const items = GOALS.map(g => ({ label: g.label, value: Math.min((val[g.key] || 0) / g.target, 1), text: `${val[g.key] || 0} of ${g.target}` }));
  return `<div class="wpad">${Radar(items)}<div class="small faint" style="text-align:center">Progress against weekly goals. Edit the targets in GOALS.</div></div>`;
};
const wActivity = () => {
  const days = [...Array(7)].map((_, i) => { const d = new Date(); d.setDate(d.getDate() - (6 - i)); return d; });
  const data = days.map(d => { const k = isoDay(d); return { d, a: appliedJobs().filter(j => j.date === k).length, m: OUTREACH.filter(o => o.date === k).length }; });
  const max = Math.max(3, ...data.map(x => Math.max(x.a, x.m)));
  return `<div class="wpad"><div class="bars">${data.map(x => `<div class="bar"><div class="bpair"><i style="height:${(x.a / max) * 100}%;background:var(--accent)" title="${x.a} applied"></i><i style="height:${(x.m / max) * 100}%;background:var(--info)" title="${x.m} messages"></i></div><span class="small faint">${x.d.toLocaleDateString("en-GB", { weekday: "short" })}</span><span class="small">${x.a + x.m || ""}</span></div>`).join("")}</div>
    <div class="small muted" style="display:flex;gap:14px;margin-top:8px"><span><span class="dot" style="background:var(--accent)"></span>Applications</span><span><span class="dot" style="background:var(--info)"></span>Messages</span></div></div>`;
};
const wTracks = () => {
  const tracks = [...new Set(jobs().map(j => j.track))];
  const rows = tracks.map(t => ({ t, tracked: jobs().filter(j => j.track === t && statusOf(j) !== "closed").length, applied: jobs().filter(j => j.track === t && isApplied(j)).length })).filter(r => r.tracked);
  const max = Math.max(1, ...rows.map(r => r.tracked));
  return `<div class="wpad">${rows.map(r => `<div class="hb"><div class="row2"><span>${esc(r.t)}</span><span class="small muted">${r.applied} applied of ${r.tracked}</span></div><div class="track"><i style="width:${(r.tracked / max) * 100}%;background:var(--line)"></i><i class="over" style="width:${(r.applied / max) * 100}%;background:var(--accent)"></i></div></div>`).join("")}</div>`;
};
const wResumeUse = () => {
  const rows = RESUMES.map(r => ({ n: r.name, k: appliedJobs().filter(j => j.resume === r.name).length }));
  const max = Math.max(1, ...rows.map(r => r.k));
  return `<div class="wpad">${rows.map(r => `<div class="hb"><div class="row2"><span>${esc(r.n)}</span><span class="small muted">${r.k} used</span></div><div class="track"><i style="width:${(r.k / max) * 100}%;background:var(--accent)"></i></div></div>`).join("")}<button class="linkbtn" type="button" data-go="resumes">See where each was used</button></div>`;
};
const wPipeline = () => {
  const total = jobs().length || 1;
  const counts = STATUSES.map(([k, l]) => [k, l, jobs().filter(j => statusOf(j) === k).length]);
  return `<div class="wpad"><div class="pipe">${counts.map(([k, , n]) => n ? `<span style="width:${(n / total) * 100}%;background:${col(k)}"></span>` : "").join("")}</div><div class="legend">${counts.map(([k, l, n]) => `<button type="button" data-go="${k}"><span>${Dot(k)}${l}</span><b>${n}</b></button>`).join("")}</div></div>`;
};
const wNext = () => `<div class="wpad">${NEXT.map((t, i) => `<label class="check ${store.n[i] ? "done" : ""}"><input type="checkbox" data-next="${i}" ${store.n[i] ? "checked" : ""}><span>${esc(t)}</span></label>`).join("")}</div>`;
const wLeads = () => watchJobs().map(j => JobRow(j, { compact: true })).join("") || `<div class="empty">No open leads.</div>`;
const wAlerts = () => `<div class="wpad">${ALERTS.map(x => `<div class="li"><span>${esc(x.q)}</span><span class="pill ${x.on ? "ok" : ""}">${x.on ? "On" : "Check"}</span></div>`).join("")}</div>`;

const WDEF = [
  { id: "kpis", title: "Summary", span: 12, bare: true, render: wKpis },
  { id: "applied", title: "Applied", span: 7, render: wApplied, flush: true },
  { id: "goals", title: "Weekly goals", span: 5, render: wGoals },
  { id: "activity", title: "Last 7 days", span: 6, render: wActivity },
  { id: "tracks", title: "By track", span: 6, render: wTracks },
  { id: "resumes", title: "Resume use", span: 4, render: wResumeUse },
  { id: "pipeline", title: "Pipeline", span: 4, render: wPipeline },
  { id: "next", title: "Next", span: 4, render: wNext },
  { id: "leads", title: "Leads to watch", span: 8, collapsed: true, render: wLeads, flush: true },

];
const isHidden = id => !!store.w.hidden[id];
const isCollapsed = d => store.w.collapsed[d.id] != null ? store.w.collapsed[d.id] : !!d.collapsed;
const Widget = d => {
  if (d.bare) return `<div class="w" style="--span:${d.span}">${d.render()}</div>`;
  const c = isCollapsed(d);
  return `<section class="panel w" style="--span:${d.span}"><div class="wh"><h2>${esc(d.title)}</h2><button class="wc" type="button" data-collapse="${d.id}" aria-expanded="${!c}" aria-label="${c ? "Expand" : "Collapse"} ${esc(d.title)}">${c ? "+" : "&minus;"}</button></div>${c ? "" : `<div class="wb ${d.flush ? "flush" : ""}">${d.render()}</div>`}</section>`;
};
function Overview() {
  const shown = WDEF.filter(d => !isHidden(d.id));
  return `${state.noteHidden ? "" : NOTES.map(n => `<div class="note"><b>${esc(n.title)}</b><span>${esc(n.body)}</span><button type="button" data-hidenote aria-label="Dismiss">&times;</button></div>`).join("")}
    <div class="wgrid">${shown.map(Widget).join("") || `<div class="empty">All widgets are hidden. Use Customize to bring them back.</div>`}</div>`;
}
function Actions() {
  if (state.tab === "prep") { const list = prepJobs(); if (!list.length) return ""; const cur = prepJob(); return `<div class="prepbar"><label class="small muted">Role <select data-prepjob aria-label="Choose a role">${list.map(j => `<option value="${j.id}"${j.id === cur.id ? " selected" : ""}>${esc(j.company)}: ${esc(j.role)}</option>`).join("")}</select></label><button class="btn" type="button" data-print>Print</button></div>`; }
  if (state.tab !== "overview") return "";
  return `<div class="cust"><button class="btn" type="button" data-cust aria-expanded="${!!state.cust}">Customize</button>${state.cust ? `<div class="menu" role="group" aria-label="Show widgets">${WDEF.filter(d => !d.bare).map(d => `<label class="check"><input type="checkbox" data-wshow="${d.id}" ${isHidden(d.id) ? "" : "checked"}><span>${esc(d.title)}</span></label>`).join("")}<button class="linkbtn" type="button" data-wreset>Reset layout</button></div>` : ""}</div>`;
}

function Jobs() {
  const tracks = [...new Set(jobs().map(j => j.track))];
  const cnt = k => k === "all" ? jobs().length : jobs().filter(j => statusOf(j) === k).length;
  const seg = (v, l) => `<button type="button" data-g="status" data-v="${v}" aria-pressed="${state.status === v}" class="${cnt(v) ? "" : "zero"}">${v === "all" ? "" : Dot(v)}${esc(l)}<span class="n">${cnt(v)}</span></button>`;
  return `<section class="panel">
    <div class="controls">
      <div class="seg" role="group" aria-label="Filter by status">${seg("all", "All")}${STATUSES.map(([k, l]) => seg(k, l)).join("")}</div>
      <div class="ctl">
        <label>Track <select data-filter="track" aria-label="Track"><option value="all">All tracks</option>${tracks.map(t => `<option value="${esc(t)}"${state.track === t ? " selected" : ""}>${esc(t)}</option>`).join("")}</select></label>
        <label>Sort <select id="sort" aria-label="Sort"><option value="status">Status</option><option value="recent">Most recent</option><option value="company">Company A to Z</option></select></label>
        <button class="btn" type="button" data-expand>Expand all</button>
      </div>
    </div>
    <div class="subbar"><span id="resultCount"></span><button class="linkbtn" type="button" data-clear hidden>Clear filters</button></div>
    <div id="jobsList"></div></section>`;
}
const filteredJobs = () => jobs().filter(j => (state.status === "all" || statusOf(j) === state.status) && (state.track === "all" || j.track === state.track) && matches(j, state.q));
function JobsList() {
  const by = { status: (a, b) => ORDER[statusOf(a)] - ORDER[statusOf(b)] || a.company.localeCompare(b.company), recent: (a, b) => (b.date || "").localeCompare(a.date || "") || a.company.localeCompare(b.company), company: (a, b) => a.company.localeCompare(b.company) };
  const list = filteredJobs().sort(by[state.sort]);
  $("#jobsList").innerHTML = list.length ? list.map(j => JobRow(j)).join("") : `<div class="empty">Nothing matches these filters.<br><button class="linkbtn" type="button" data-clear>Clear filters</button></div>`;
  const s = $("#sort"); if (s) s.value = state.sort;
  const active = state.status !== "all" || state.track !== "all" || !!state.q;
  const rc = $("#resultCount"); if (rc) rc.textContent = `Showing ${list.length} of ${jobs().length}` + (state.q ? ` for "${state.q}"` : "");
  const cl = document.querySelector(".subbar [data-clear]"); if (cl) cl.hidden = !active;
}

function Companies() {
  const all = companies().filter(c => !state.q || c.name.toLowerCase().includes(state.q.toLowerCase()) || c.list.some(j => matches(j, state.q)));
  if (!all.find(c => c.name === state.company)) state.company = all[0] ? all[0].name : null;
  const sel = all.find(c => c.name === state.company);
  const msgs = sel ? OUTREACH.map((o, i) => [o, i]).filter(([o]) => o.company === sel.name || sel.name.startsWith(o.company) || o.company.startsWith(sel.name)) : [];
  return `<div class="md">
    <section class="panel"><h2>${all.length} companies</h2><div class="body flush clist">${all.map(c => `<button class="citem" type="button" data-company="${esc(c.name)}" aria-current="${c.name === state.company}"><span><b>${esc(c.name)}</b><div class="small muted">${c.list.length} role${c.list.length > 1 ? "s" : ""}</div></span><span class="pill ${c.applied ? "ok" : ""}">${c.applied} applied</span></button>`).join("") || `<div class="empty">No match.</div>`}</div></section>
    <section class="panel cd">${sel ? `<div class="sec"><h3>${esc(sel.name)}</h3><div class="muted small">${sel.applied} applied of ${sel.list.length} tracked, ${msgs.length} message${msgs.length === 1 ? "" : "s"} sent</div></div>
      <div class="sec" style="padding:0"><div style="padding:12px 14px 4px"><div class="h4" style="margin:0">Roles</div></div>${sel.list.map(j => JobRow(j)).join("")}</div>
      <div class="sec"><div class="h4">Outreach</div>${msgs.length ? msgs.map(([o, i]) => `<div class="li"><div><b>${esc(o.name)}</b><div class="small muted">${esc(o.role)}, ${fmtDate(o.date)}</div></div><span class="pill">${esc(ostatus(o, i))}</span></div>`).join("") : `<div class="muted small">No messages sent here yet.</div>`}</div>` : `<div class="empty">Select a company.</div>`}</section>
  </div>`;
}

function Outreach() {
  const rows = OUTREACH.map((o, i) => [o, i]).filter(([o]) => !state.q || `${o.company} ${o.name} ${o.role}`.toLowerCase().includes(state.q.toLowerCase()));
  const targets = companies().filter(c => c.applied);
  return `<div class="cols">
    <section class="panel"><h2>Messages <span class="faint">${rows.length}</span></h2><div class="body flush">
      <div class="orow head"><span>Person</span><span>Company</span><span>For</span><span>Date</span><span>Status</span></div>
      ${rows.length ? rows.map(([o, i]) => `<div class="orow"><span><b>${esc(o.name)}</b><div class="small muted">${esc(o.channel)}</div></span><span>${esc(o.company)}</span><span class="muted">${esc(o.role)}</span><span class="muted">${fmtDate(o.date)}</span><select data-ostat="${i}" aria-label="Status">${OSTAT.map(s => `<option${s === ostatus(o, i) ? " selected" : ""}>${s}</option>`).join("")}</select></div>`).join("") : `<div class="empty">No messages sent yet.</div>`}
    </div></section>
    <div class="stack">
      <details class="panel" open><summary>Templates</summary><div class="body flush">${TEMPLATES.map((t, i) => `<details class="acc"><summary>${esc(t.name)}</summary><div class="body"><div class="tpl">${esc(t.body)}</div><button class="btn" type="button" data-copy="${i}">Copy</button></div></details>`).join("")}</div></details>
      <details class="panel"><summary>Who to reach</summary><div class="body">${targets.map(c => `<div class="li"><div><b>${esc(c.name)}</b><div class="small muted">Engineers, hiring managers, GITAM alumni</div></div><span class="pill">${c.applied}</span></div>`).join("")}</div></details>
    </div>
  </div>`;
}

function Resumes() {
  const usedBy = r => jobs().filter(j => j.resume === r.name && isApplied(j)).sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  const names = RESUMES.map(r => r.name);
  const used = jobs().filter(j => j.resume && isApplied(j));
  const cos = [...new Set(used.map(j => j.company))];
  const cards = RESUMES.map(r => {
    const u = usedBy(r);
    return `<section class="panel rcard">
      <div class="rh"><div><h3>${esc(r.name)}</h3><div class="muted small">${esc(r.use)}</div></div><span class="pill ${u.length ? "ok" : ""}">${u.length} used</span></div>
      <div class="rbody">${u.length ? u.map(j => JobRow(j, { stack: true, select: false })).join("") : `<div class="empty small">Not used yet</div>`}</div>
      <div class="rfoot"><a class="btn dl" href="${esc(r.file)}" download>Download PDF</a><a class="link small" href="${esc(r.file)}" target="_blank" rel="noopener">Open</a></div>
    </section>`;
  }).join("");
  const attrs = [["Best for", "use"], ["Headline", "headline"], ["Summary", "summary"], ["Skills order", "skills"], ["Project order", "projects"]];
  const compare = `<section class="panel"><h2>Compare versions</h2><div class="body flush scrollx"><table class="cmp"><thead><tr><th></th>${names.map(n => `<th>${esc(n)}</th>`).join("")}</tr></thead><tbody>
    ${attrs.map(([l, k]) => `<tr><th scope="row">${l}</th>${RESUMES.map(r => `<td>${esc(r[k])}</td>`).join("")}</tr>`).join("")}
    </tbody></table></div></section>`;
  const matrix = `<section class="panel"><h2>Company by resume</h2><div class="body flush scrollx"><table class="matrix"><thead><tr><th>Company</th>${names.map(n => `<th class="c">${esc(n)}</th>`).join("")}<th>Roles</th></tr></thead><tbody>
    ${cos.map(c => { const rows = used.filter(j => j.company === c); return `<tr><td><b>${esc(c)}</b></td>${names.map(n => { const k = rows.filter(j => j.resume === n).length; return `<td class="c">${k ? `<span class="tag">${k}</span>` : `<span class="faint">0</span>`}</td>`; }).join("")}<td class="muted small">${rows.map(j => esc(j.role)).join(", ")}</td></tr>`; }).join("") || `<tr><td class="muted" colspan="${names.length + 2}">No applications yet.</td></tr>`}
    </tbody></table></div></section>`;
  return `<div class="rgrid">${cards}</div><div class="stack">${compare}${matrix}</div>`;
}
/* ============ INTERVIEW PREP ============ */
const LVL = { strong: ["Strong", 1], partial: ["Partial", 0.5], gap: ["Gap", 0.1] };
const prepJobs = () => jobs().filter(isApplied);
function prepJob() {
  const list = prepJobs();
  if (!list.length) return null;
  const cur = list.find(j => j.id === state.prep);
  if (cur) return cur;
  state.prep = list[0].id;
  return list[0];
}
function fallbackPrep(j) {
  return { jd: "none", about: "No tailored prep yet for this role. Showing a starter set based on the resume used.",
    pitch: [["Who", "Final-year CSE at GITAM, graduating Aug 2027."], ["Proof", "Name your best project and one number from it."], ["Why this", `Say one specific thing you like about ${j.company}.`]],
    fit: [], stories: (RESUME_STORIES[j.resume] || ["mas", "drdo", "viswam"]).map(id => [id, ""]),
    qa: [{ q: "Tell me about yourself", a: ["Who: final-year CSE at GITAM", "Built: a data platform and a RAG copilot", "Want: this role, and why"] }],
    gaps: [], ask: ["What would I own in the first month?", "How is success measured?"], keys: [] };
}
const prepFor = j => PREP[j.id] || fallbackPrep(j);

function Ring(pct) {
  const r = 34, c = 2 * Math.PI * r, d = (pct / 100) * c;
  return `<svg viewBox="0 0 90 90" class="ring" role="img" aria-label="Overall match ${pct} percent"><circle cx="45" cy="45" r="${r}" fill="none" stroke="var(--line)" stroke-width="9"/><circle cx="45" cy="45" r="${r}" fill="none" stroke="var(--accent)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${d.toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 45 45)"/><text x="45" y="50" text-anchor="middle" class="ringn">${pct}%</text></svg>`;
}
const Flow = steps => `<div class="flow">${steps.map((s, i) => `<span class="fs">${esc(s)}</span>${i < steps.length - 1 ? '<span class="arr">&rarr;</span>' : ""}`).join("")}</div>`;
const Gate = () => `<svg viewBox="0 0 330 70" class="gate" role="img" aria-label="Score at or above 0.85 is auto approved, below goes to human review"><rect x="2" y="22" width="70" height="26" rx="7" fill="var(--soft)" stroke="var(--line)"/><text x="37" y="39" text-anchor="middle" class="gl">Score</text><path d="M72 35 H98" stroke="var(--faint)"/><path d="M98 35 L130 12 L162 35 L130 58 Z" fill="var(--soft)" stroke="var(--line)"/><text x="130" y="39" text-anchor="middle" class="gl">0.85?</text><path d="M162 35 H196" stroke="var(--s-applied)"/><rect x="196" y="8" width="126" height="24" rx="7" fill="var(--accent-soft)" stroke="var(--s-applied)"/><text x="259" y="24" text-anchor="middle" class="gl">At or above: auto</text><path d="M130 58 V62 H196" stroke="var(--warn)" fill="none"/><rect x="196" y="40" width="126" height="24" rx="7" fill="var(--warn-soft)" stroke="var(--warn)"/><text x="259" y="56" text-anchor="middle" class="gl">Below: human review</text></svg>`;

function fitCats(fit) {
  const m = new Map();
  fit.forEach(f => { if (!m.has(f.cat)) m.set(f.cat, []); m.get(f.cat).push(LVL[f.lvl][1]); });
  return [...m.entries()].map(([label, v]) => { const avg = v.reduce((a, b) => a + b, 0) / v.length; return { label, value: avg, text: `${Math.round(avg * 100)}%` }; });
}
const overall = fit => fit.length ? Math.round((fit.reduce((a, f) => a + LVL[f.lvl][1], 0) / fit.length) * 100) : 0;

const PanelP = (id, title, span, body, opts = {}) => {
  const key = "p_" + id, c = !!store.w.collapsed[key];
  return `<section class="panel w" style="--span:${span}"><div class="wh"><h2>${esc(title)}</h2><button class="wc" type="button" data-collapse="${key}" aria-expanded="${!c}" aria-label="${c ? "Expand" : "Collapse"} ${esc(title)}">${c ? "+" : "&minus;"}</button></div>${c ? "" : `<div class="wb ${opts.flush ? "flush" : ""}">${body}</div>`}</section>`;
};

function Prep() {
  const list = prepJobs();
  if (!list.length) return `<div class="empty">Apply to a role first. Prep appears here for every role marked Applied.</div>`;
  const j = prepJob(), p = prepFor(j), r = RESUMES.find(x => x.name === j.resume);
  const cats = fitCats(p.fit), pct = overall(p.fit);
  const banner = `<div class="note"><b>${esc(j.company)}</b><span>${esc(j.role)}</span><span class="tag">${esc(j.resume || "no resume")} resume</span><span class="pill ${p.jd === "full" ? "ok" : ""}">${p.jd === "full" ? "Full JD read" : p.jd === "partial" ? "JD not captured" : "Starter prep"}</span></div>
    <div class="small muted" style="margin:-4px 0 12px">${esc(p.about)}</div>`;

  const pitch = `<div class="wpad"><ol class="steps">${p.pitch.map(([k, t], i) => `<li><span class="sn">${i + 1}</span><div><b>${esc(k)}</b><div>${esc(t)}</div></div></li>`).join("")}</ol><div class="small faint">Say it in about 30 seconds.</div></div>`;

  const fit = p.fit.length ? `<div class="wpad fitgrid"><div>${cats.length >= 3 ? Radar(cats) : ""}<div class="ringrow">${Ring(pct)}<div class="small muted">Overall match against the JD. Strong counts fully, partial half.</div></div></div>
      <div class="reqs">${p.fit.map(f => `<div class="req"><span class="lv ${f.lvl}">${LVL[f.lvl][0]}</span><div><b>${esc(f.need)}</b><div class="small muted">${esc(f.ev)}</div></div></div>`).join("")}</div></div>` : `<div class="empty small">No JD fit yet for this role.</div>`;

  const nums = [...new Map(p.stories.flatMap(([id]) => (STORIES[id] ? STORIES[id].nums.map(n => [n[1] + id, [n[0], n[1], STORIES[id].title]]) : []))).values()];
  const numbers = nums.length ? `<div class="wpad nums">${nums.slice(0, 8).map(([n, l, t]) => `<div class="num"><b>${esc(n)}</b><span>${esc(l)}</span><i>${esc(t)}</i></div>`).join("")}</div>` : `<div class="empty small">No numbers to show.</div>`;

  const stories = `<div class="wpad cards2">${p.stories.map(([id, angle]) => { const s = STORIES[id]; if (!s) return ""; return `<article class="story">
      <div class="sh"><div><h3>${esc(s.title)}</h3><div class="small muted">${esc(s.sub)}</div></div>${s.nums.length ? `<div class="mini">${s.nums.slice(0, 2).map(n => `<span><b>${esc(n[0])}</b>${esc(n[1])}</span>`).join("")}</div>` : ""}</div>
      ${Flow(s.flow)}${s.gate ? Gate() : ""}
      <div class="say">${esc(s.say)}</div>
      ${angle ? `<div class="angle"><b>For this role:</b> ${esc(angle)}</div>` : ""}
      <div class="chips">${s.stack.map(x => `<span class="chip2">${esc(x)}</span>`).join("")}${s.fill.map(x => `<span class="chip2 fill" title="Not on your resume. Fill in your own number">Add: ${esc(x)}</span>`).join("")}</div>
      <details class="more"><summary>Likely follow ups</summary><ul class="bul">${s.ask.map(q => `<li>${esc(q)}</li>`).join("")}<li class="muted">${esc(s.tip)}</li></ul></details></article>`; }).join("")}</div>`;

  const qa = `<div class="body flush qa">${p.qa.map((x, i) => `<details class="q"${i === 0 ? " open" : ""}><summary><span class="qn">Q${i + 1}</span><span class="qt">${esc(x.q)}</span><span class="qc" aria-hidden="true"></span></summary><ol class="beats">${x.a.map((a, k) => `<li><span>${k + 1}</span><div>${esc(a)}</div></li>`).join("")}</ol></details>`).join("")}<div class="qhint">Answer in this order, one beat at a time.</div></div>`;

  const gaps = p.gaps.length ? `<div class="wpad">${p.gaps.map(g => `<div class="gapc"><b>${esc(g.g)}</b><div class="small muted">${esc(g.p)}</div></div>`).join("")}</div>` : `<div class="empty small">No gaps listed.</div>`;
  const ask = `<div class="wpad"><ul class="bul">${p.ask.map(a => `<li>${esc(a)}</li>`).join("")}</ul></div>`;
  const keys = p.keys.length ? `<div class="wpad chips">${p.keys.map(k => `<span class="chip2 big">${esc(k)}</span>`).join("")}</div>` : `<div class="empty small">No keywords yet.</div>`;

  return `${banner}<div class="wgrid">
    ${PanelP("pitch", "30 second pitch", 5, pitch)}
    ${PanelP("fit", "JD fit", 7, fit)}
    ${PanelP("stories", "Stories to tell", 12, stories)}
    ${PanelP("qa", "Likely questions", 7, qa, { flush: true })}
    ${PanelP("gaps", "Gaps and how to handle them", 5, gaps)}
    ${PanelP("nums", "Numbers to remember", 4, numbers)}
    ${PanelP("keys", "Keywords", 4, keys)}
    ${PanelP("ask", "Ask them", 4, ask)}
  </div>`;
}

const VIEWS = { prep: Prep, overview: Overview, jobs: Jobs, companies: Companies, outreach: Outreach, resumes: Resumes };

/* ============ SHELL ============ */
function renderNav() {
  const n = { jobs: jobs().length, companies: companies().length, outreach: OUTREACH.length, resumes: RESUMES.length, prep: appliedJobs().length };
  $("#nav").innerHTML = Object.keys(PAGES).map(k => `<button type="button" data-tab="${k}" ${state.tab === k ? 'aria-current="page"' : ""}><span>${PAGES[k][0]}</span>${n[k] != null ? `<span class="n">${n[k]}</span>` : ""}</button>`).join("");
}
function render() {
  renderNav();
  $("#ptitle").textContent = PAGES[state.tab][0];
  $("#psub").textContent = PAGES[state.tab][1];
  $("#pactions").innerHTML = Actions();
  $("#view").innerHTML = VIEWS[state.tab]();
  if (state.tab === "jobs") JobsList();
}
function setTab(t) { state.tab = VIEWS[t] ? t : "overview"; history.replaceState(null, "", "#" + state.tab); render(); window.scrollTo(0, 0); }
function go(a) {
  if (a === "companies" || a === "outreach") return setTab(a);
  if (LABEL[a]) { state.status = a; state.track = "all"; return setTab("jobs"); }
  if (a === "applied") { state.status = "applied"; return setTab("jobs"); }
}

document.addEventListener("click", e => {
  if (state.cust && !e.target.closest(".cust")) { state.cust = false; $("#pactions").innerHTML = Actions(); }
  const g = e.target.closest("[data-go]"); if (g) return go(g.dataset.go);
  const t = e.target.closest("[data-tab]"); if (t) return setTab(t.dataset.tab);
  if (e.target.closest("[data-hidenote]")) { state.noteHidden = true; return render(); }
  const wc = e.target.closest("[data-collapse]"); if (wc) { const id = wc.dataset.collapse; const d = WDEF.find(x => x.id === id); const cur = d ? isCollapsed(d) : !!store.w.collapsed[id]; store.w.collapsed[id] = !cur; persist(); return keepScroll(render); }
  if (e.target.closest("[data-print]")) return window.print();
  if (e.target.closest("[data-cust]")) { state.cust = !state.cust; return render(); }
  if (e.target.closest("[data-wreset]")) { store.w = { hidden: {}, collapsed: {} }; persist(); return render(); }
  const c = e.target.closest("[data-g]"); if (c) { state[c.dataset.g] = c.dataset.v; return render(); }
  if (e.target.closest("[data-clear]")) { state.status = "all"; state.track = "all"; state.q = ""; $("#gsearch").value = ""; return render(); }
  const tg = e.target.closest("[data-toggle]");
  if (tg) { const id = +tg.dataset.toggle; state.open.has(id) ? state.open.delete(id) : state.open.add(id); return keepScroll(render); }
  if (e.target.closest("[data-expand]")) { const list = filteredJobs(); const all = list.every(j => state.open.has(j.id)); list.forEach(j => all ? state.open.delete(j.id) : state.open.add(j.id)); return render(); }
  const co = e.target.closest("[data-company]"); if (co) { state.company = co.dataset.company; return render(); }
  const cp = e.target.closest("[data-copy]");
  if (cp) { try { navigator.clipboard.writeText(TEMPLATES[+cp.dataset.copy].body); cp.textContent = "Copied"; setTimeout(() => cp.textContent = "Copy", 1200); } catch (x) {} }
});
document.addEventListener("change", e => {
  const f = e.target.closest("select[data-filter]"); if (f) { state[f.dataset.filter] = f.value; return render(); }
  const s = e.target.closest("select[data-job]"); if (s) { store.j[s.dataset.job] = s.value; persist(); return keepScroll(render); }
  const o = e.target.closest("select[data-ostat]"); if (o) { store.o[o.dataset.ostat] = o.value; persist(); return render(); }
  const pj = e.target.closest("select[data-prepjob]"); if (pj) { state.prep = +pj.value; return render(); }
  const ws = e.target.closest("input[data-wshow]"); if (ws) { store.w.hidden[ws.dataset.wshow] = !ws.checked; persist(); return render(); }
  const n = e.target.closest("input[data-next]"); if (n) { store.n[n.dataset.next] = n.checked; persist(); return render(); }
  if (e.target.id === "sort") { state.sort = e.target.value; JobsList(); }
});
$("#gsearch").addEventListener("input", e => {
  state.q = e.target.value;
  if (state.q && (state.tab === "overview" || state.tab === "resumes")) return setTab("jobs"), $("#gsearch").focus();
  if (state.tab === "jobs") JobsList(); else render();
});
document.addEventListener("keydown", e => {
  const tag = document.activeElement.tagName;
  if (e.key === "/" && tag !== "INPUT" && tag !== "SELECT") { e.preventDefault(); $("#gsearch").focus(); }
  if (e.key === "Escape") { state.cust = false; state.q = ""; $("#gsearch").value = ""; $("#gsearch").blur(); render(); }
});
$("#theme").onclick = () => {
  const el = document.documentElement;
  const dark = el.dataset.theme ? el.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  el.dataset.theme = dark ? "light" : "dark";
};

$("#name").textContent = PROFILE.name;
$("#tagline").textContent = `${PROFILE.title}, ${PROFILE.grad}`;
$("#upd").textContent = `Updated ${META.updated}`;
setTab((location.hash || "").replace("#", "") || "overview");
</script>
</body>
